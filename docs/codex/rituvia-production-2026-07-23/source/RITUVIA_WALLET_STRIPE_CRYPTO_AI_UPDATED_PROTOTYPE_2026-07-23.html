const TAROT=[
 {n:'0',s:'✦',zh:'愚者',en:'The Fool',upZh:'新的可能正在打开，允许自己从尚未确定的地方出发。',upEn:'A new possibility is opening. You may begin before everything is certain.',altZh:'轻盈也需要边界；自由并不等于忽略现实。',altEn:'Lightness still needs boundaries; freedom is not the same as ignoring reality.',qZh:'哪一步可以小到足以开始，又真实到值得开始？',qEn:'What step is small enough to begin and real enough to matter?',aZh:'今天为一件想尝试的事留出二十分钟。',aEn:'Set aside twenty minutes today for something you want to try.'},
 {n:'I',s:'✧',zh:'魔术师',en:'The Magician',upZh:'你已经拥有一些可以调用的资源，关键在于怎样把它们放在一起。',upEn:'You already have resources you can use; the question is how to bring them together.',altZh:'行动力也可能被分散，先确认真正值得投入的方向。',altEn:'Ability can scatter. Decide what deserves your attention first.',qZh:'此刻哪一种能力最值得被认真使用？',qEn:'Which ability deserves to be used with intention right now?',aZh:'列出手边已有的三项资源，并选一项立即使用。',aEn:'Name three resources already available to you, then use one.'},
 {n:'II',s:'☾',zh:'女祭司',en:'The High Priestess',upZh:'有些理解需要安静，而不是更多解释。',upEn:'Some understanding arrives through quiet rather than more explanation.',altZh:'直觉值得倾听，但也需要与事实相互校对。',altEn:'Intuition is worth hearing, and worth checking against evidence.',qZh:'如果暂时不急着回答，你会注意到什么？',qEn:'What becomes noticeable when you stop rushing toward an answer?',aZh:'在做决定前，给自己十分钟不输入新信息。',aEn:'Take ten minutes without new input before deciding.'},
 {n:'III',s:'❀',zh:'皇后',en:'The Empress',upZh:'照料、创造与身体感受正在提醒你，成长需要可持续的条件。',upEn:'Care, creativity, and the body suggest that growth needs supportive conditions.',altZh:'给予不等于耗尽自己，丰盛也需要边界。',altEn:'Giving does not require depletion; abundance needs boundaries too.',qZh:'什么会让你在不透支自己的情况下继续成长？',qEn:'What would help you grow without depleting yourself?',aZh:'为身体或环境做一件能持续带来舒适的小事。',aEn:'Make one small change that brings lasting comfort to your body or space.'},
 {n:'IV',s:'◇',zh:'皇帝',en:'The Emperor',upZh:'结构可以带来安全感，也能让重要的事情不再只靠意志力。',upEn:'Structure can create safety and keep what matters from relying on willpower alone.',altZh:'秩序若过于僵硬，也会遮住新的信息。',altEn:'Structure can become rigid enough to hide new information.',qZh:'哪里需要更清楚的边界，哪里需要留出弹性？',qEn:'Where do you need a clearer boundary, and where do you need flexibility?',aZh:'为一个反复拖延的问题写下明确的下一步和截止时间。',aEn:'Give one delayed task a clear next step and a realistic deadline.'},
 {n:'V',s:'⌘',zh:'教皇',en:'The Hierophant',upZh:'传统、老师或共同语言可以提供支点，但不必替你决定。',upEn:'Tradition, teachers, and shared language can offer support without deciding for you.',altZh:'熟悉的规则可能需要重新理解，而不是自动服从。',altEn:'A familiar rule may need reconsideration rather than automatic obedience.',qZh:'你想继承什么，又想重新定义什么？',qEn:'What do you want to carry forward, and what needs redefining?',aZh:'写下一条你愿意保留的原则，以及一条准备调整的旧规则。',aEn:'Write one principle you want to keep and one old rule you are ready to revise.'},
 {n:'VI',s:'∞',zh:'恋人',en:'The Lovers',upZh:'这张牌更接近选择与价值一致，而不是替关系下结论。',upEn:'This card speaks more to choice and aligned values than to a verdict about a relationship.',altZh:'吸引力很强时，更需要看清自己的边界和承诺。',altEn:'Strong attraction makes boundaries and commitments more important, not less.',qZh:'哪一个选择更接近你真正想成为的人？',qEn:'Which choice is closer to the person you want to be?',aZh:'用一句话写清楚这段关系或选择中你不能放弃的价值。',aEn:'Name the value you do not want to abandon in this relationship or choice.'},
 {n:'VII',s:'⇢',zh:'战车',en:'The Chariot',upZh:'前进需要方向感，也需要让相互拉扯的部分进入同一条路。',upEn:'Moving forward requires direction and a way to bring competing impulses onto one path.',altZh:'速度不是唯一证据，掌控也不等于压抑。',altEn:'Speed is not proof, and control is not the same as suppression.',qZh:'你正在努力证明什么，又真正想抵达哪里？',qEn:'What are you trying to prove, and where do you actually want to arrive?',aZh:'删去一项不必要的目标，把精力留给最重要的一件事。',aEn:'Remove one unnecessary goal and protect the one that matters most.'},
 {n:'VIII',s:'♌',zh:'力量',en:'Strength',upZh:'真正的力量常常是温和而持续的，不必通过压制来证明。',upEn:'Real strength is often gentle and sustained; it does not need force to prove itself.',altZh:'耐心不等于无限承受，温柔也可以说不。',altEn:'Patience is not endless endurance; gentleness can still say no.',qZh:'你能否用更稳定、少一点对抗的方式面对这件事？',qEn:'Could you meet this with steadiness and less inner force?',aZh:'在一次紧张回应前，先放慢呼吸并降低语速。',aEn:'Before one tense response, slow your breathing and your pace of speech.'},
 {n:'IX',s:'⌁',zh:'隐者',en:'The Hermit',upZh:'暂时离开噪音，可能比继续寻找意见更有帮助。',upEn:'Stepping away from noise may help more than collecting another opinion.',altZh:'独处若变成逃避，也会让重要的对话无限延后。',altEn:'Solitude can become avoidance when an important conversation keeps being postponed.',qZh:'你需要的是独处、界限，还是一场诚实的交流？',qEn:'Do you need solitude, a boundary, or an honest conversation?',aZh:'安排一段无通知的独处时间，并在结束后写下一句话。',aEn:'Take a notification-free pause and write one sentence afterward.'},
 {n:'X',s:'◌',zh:'命运之轮',en:'Wheel of Fortune',upZh:'环境正在变化，你可以关注自己怎样回应，而不是要求一切保持不变。',upEn:'Conditions are changing. Your response may matter more than keeping everything the same.',altZh:'把变化全部归因于命运，会遮住你仍然拥有的选择。',altEn:'Calling every change fate can hide the choices that remain yours.',qZh:'在无法控制的变化里，你仍能稳定什么？',qEn:'What can you steady within a change you cannot control?',aZh:'把当前问题分成“可控制、可影响、只能接受”三栏。',aEn:'Sort the situation into what you can control, influence, and only accept.'},
 {n:'XI',s:'⚖',zh:'正义',en:'Justice',upZh:'清楚的事实、责任与后果，比一时情绪更能帮助你判断。',upEn:'Clear facts, responsibility, and consequences can guide you better than the feeling of the moment.',altZh:'追求公平时，也要留意自己是否只看见有利的一面。',altEn:'When seeking fairness, notice whether you are seeing only the evidence that favors you.',qZh:'如果把同样标准用于自己与他人，结论会怎样变化？',qEn:'What changes if the same standard is applied to you and to others?',aZh:'在行动前写下已知事实、未知信息和你的假设。',aEn:'Before acting, separate known facts, missing information, and assumptions.'},
 {n:'XII',s:'↟',zh:'倒吊人',en:'The Hanged Man',upZh:'暂停并不是失败，换一个角度可能比继续用力更有效。',upEn:'A pause is not failure. A different angle may help more than pushing harder.',altZh:'等待也需要边界，不能把迟迟不决定包装成深思。',altEn:'Waiting needs limits too; indecision is not always reflection.',qZh:'什么旧角度已经不能再解释眼前的事？',qEn:'Which old perspective no longer explains what is happening?',aZh:'请一个可信任的人只描述事实，不替你给建议。',aEn:'Ask someone you trust to describe what they see without advising you.'},

function cloneDefault(){return JSON.parse(JSON.stringify(DEFAULT_STATE))}
function loadState(){
 try{
  const parsed=JSON.parse(STORAGE.getItem(STORAGE_KEY)||'null');
  if(!parsed||parsed.version!==DEFAULT_STATE.version)return cloneDefault();
  const base=cloneDefault(),s={...base,...parsed};
  ['auth','wallet','payments','ai','settings','daily','tarot','deep','numerology','astrology','credits','subscription','ritual','checkout','privacy'].forEach(k=>s[k]={...base[k],...(parsed[k]||{})});
  s.tarot.history=Array.isArray(parsed.tarot?.history)?parsed.tarot.history:[];
  s.deep.history=Array.isArray(parsed.deep?.history)?parsed.deep.history:[];
  s.credits.ledger=Array.isArray(parsed.credits?.ledger)?parsed.credits.ledger:base.credits.ledger;
  s.intentions=Array.isArray(parsed.intentions)?parsed.intentions:[];s.journal=Array.isArray(parsed.journal)?parsed.journal:[];s.revisits=Array.isArray(parsed.revisits)?parsed.revisits:[];s.orders=Array.isArray(parsed.orders)?parsed.orders:[];
  s.ownedObjects=Array.isArray(parsed.ownedObjects)?parsed.ownedObjects:base.ownedObjects;s.ritualPasses=parsed.ritualPasses||{};s.reservations=parsed.reservations||{};
  return s;
 }catch(e){console.warn('Prototype state reset',e);return cloneDefault()}
}
let state=loadState(),lastFocusedElement=null,ritualInterval=null;
function saveState(){try{STORAGE.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){console.warn('RITUVIA state could not persist',e)}}
function L(zh,en){return state.lang==='zh'?zh:en}
function esc(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function uid(prefix='id'){return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`}
function money(cents){return new Intl.NumberFormat(state.lang==='zh'?'zh-CN':'en-US',{style:'currency',currency:'USD'}).format(cents/100)}
function localDateKey(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function fmtDate(value,withTime=false){if(!value)return L('未设置','Not set');const d=new Date(value);if(Number.isNaN(d.getTime()))return value;return new Intl.DateTimeFormat(state.lang==='zh'?'zh-CN':'en-US',withTime?{dateStyle:'medium',timeStyle:'short'}:{dateStyle:'medium'}).format(d)}
function hashText(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function randomInt(max){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max}

function creditTotal(){return Math.max(0,(state.credits.subscription||0)+(state.credits.promotional||0)+(state.credits.purchased||0))}
function creditTypeLabel(type){return ({subscription_credit:L('Plus 每月 Credits','Plus monthly Credits'),promotional_credit:L('赠送 Credits','Complimentary Credits'),purchased_credit:L('购买的 Credits','Purchased Credits'),refund_adjustment:L('退款调整','Refund adjustment')})[type]||type}
function appendLedger({type,amount,reason,productCode='',orderId='',reservationId='',reversalRef='',expiry=null,status='posted'}){
 const entry={id:uid('ledger'),type,amount,reason,productCode,orderId,reservationId,reversalRef,createdAt:new Date().toISOString(),expiry,status,policyVersion:'credit-policy-v1',termsVersion:'terms-v1'};state.credits.ledger.unshift(entry);state.credits.ledger=state.credits.ledger.slice(0,120);return entry;
}
function addCredits(type,amount,reason,productCode='',orderId='',expiry=null){
 if(type==='subscription_credit')state.credits.subscription+=amount;
 else if(type==='promotional_credit')state.credits.promotional+=amount;
 else state.credits.purchased+=amount;
 appendLedger({type,amount,reason,productCode,orderId,expiry});
}
function reserveCredits(amount,productCode){
 if(amount<=0)return{id:uid('res'),amount:0,breakdown:[]};
 if(creditTotal()<amount)return null;
 let remaining=amount;const breakdown=[];
 const order=[['subscription_credit','subscription'],['promotional_credit','promotional'],['purchased_credit','purchased']];
 for(const[type,key]of order){if(remaining<=0)break;const use=Math.min(state.credits[key],remaining);if(use>0){state.credits[key]-=use;remaining-=use;breakdown.push({type,key,amount:use})}}
 const id=uid('reservation');state.reservations[id]={id,productCode,amount,breakdown,status:'reserved',createdAt:new Date().toISOString()};
 breakdown.forEach(b=>appendLedger({type:b.type,amount:-b.amount,reason:'credit_reserved',productCode,reservationId:id,status:'reserved'}));saveState();return state.reservations[id];
}
function finalizeReservation(id,generationId=''){
 const r=state.reservations[id];if(!r||r.status!=='reserved')return false;r.status='finalized';r.finalizedAt=new Date().toISOString();r.generationId=generationId;
 appendLedger({type:'refund_adjustment',amount:0,reason:'credit_consumption_finalized',productCode:r.productCode,reservationId:id,status:'finalized'});saveState();return true;
}
function releaseReservation(id,reason='generation_failed'){
 const r=state.reservations[id];if(!r||r.status!=='reserved')return false;r.status='released';r.releasedAt=new Date().toISOString();
 r.breakdown.forEach(b=>{state.credits[b.key]+=b.amount;appendLedger({type:b.type,amount:b.amount,reason,productCode:r.productCode,reservationId:id,reversalRef:id,status:'reversal'})});saveState();return true;
}

ticle></div><div class="section-head" style="margin-top:42px"><div><div class="eyebrow">${L('想再多看一层','When you want more context')}</div><h2>${L('深度解读','Deep Readings')}</h2></div><p>${L('深度解读会结合你愿意分享的背景，由 AI 辅助形成一份更贴近处境的反思。继续之前，你会先看到所需 Credits 和包含内容。','Deep Readings bring in the context you choose to share for an AI-assisted reflection that feels closer to your situation. You will see the Credit cost and what is included before you continue.')}</p></div><div class="deep-grid">${DEEP_PRODUCTS.map(p=>`<article class="product-card deep-card"><div class="method-icon">${p.icon}</div><span class="badge credit" style="align-self:flex-start">${p.credits} Credit${p.credits===1?'':'s'}</span><h3 style="margin-top:16px">${L(p.zh,p.en)}</h3><p>${L(p.descZh,p.descEn)}</p><div class="cost"><strong>${p.credits} Credit${p.credits===1?'':'s'}</strong><a class="ghost-btn" href="#deep" onclick="selectDeep('${p.code}')">${L('了解详情','See details')}</a></div></article>`).join('')}</div><div class="section-head" style="margin-top:48px"><div><div class="eyebrow">${L('另外两种方式','Two more ways to reflect')}</div><h2>${L('数字命理与西方占星','Numerology & Western Astrology')}</h2></div><p>${L('一个从数字的结构出发，一个从出生时刻的象征语言出发。都可以继续写成意图，带进圣所。','One begins with the structure of numbers; the other with the symbolic language of a birth moment. Both can continue into an intention and the Sanctuary.')}</p></div><div class="grid-2">${methodCard('numerology','∑','数字命理','Numerology','生命路径、生日数与个人年，每一步计算都清楚可见。','Life Path, Birthday Number, and Personal Year, with every calculation shown.','Free')}${methodCard('astrology','◉','西方占星','Western Astrology','从太阳星座开始，看看哪些长期主题值得你留意。','Begin with your Sun sign and explore the longer-running themes it may bring into view.','Free')}</div></div></div>`}

function ensureDaily(){const date=localDateKey();if(state.daily.date!==date){const seed=hashText(`RITUVIA:${date}`);state.daily={date,revealed:false,cardIndex:seed%TAROT.length,orientation:((seed>>>7)%2)?'upright':'reversed'};saveState()}return state.daily}
function revealDaily(){ensureDaily();state.daily.revealed=true;saveState();renderApp();setTimeout(()=>document.getElementById('dailyResult')?.scrollIntoView({behavior:state.settings.reduceMotion?'auto':'smooth',block:'start'}),40)}
function createIntentionFromText(text,source='reading'){const existing=state.intentions.find(i=>i.source===source&&i.text===text);if(existing){state.activeIntentionId=existing.id}else{const i={id:uid('intention'),text,action:'',source,createdAt:new Date().toISOString(),revisitDate:''};state.intentions.unshift(i);state.activeIntentionId=i.id}saveState();go('sanctuary')}
function renderDaily(){const d=ensureDaily(),card=TAROT[d.cardIndex],rev=d.orientation==='reversed';return `<div class="page"><div class="shell">${crumbs([L('解读','Readings'),L('每日塔罗','Daily Tarot')])}<div class="page-heading"><div><div class="eyebrow">${L('今天的一张牌','One card for today')}</div><h1>${L('今天，只留一张牌','One card is enough for today')}</h1></div><p>${L('今天无论回来多少次，都会看到同一张牌。慢慢读，不必急着得到结论。','Return whenever you like today—the same card will be here. Read it slowly; there is no need to force an answer.')}</p></div>${!d.revealed?`<div class="daily-card panel"><div class="daily-visual"><div class="tarot-card"><div class="card-inner"><div class="card-num">RITUVIA</div><div class="card-symbol">✦</div><h4>${L('今天的一张牌','One card for today')}</h4><div class="orientation">${fmtDate(new Date().toISOString())}</div></div></div></div><div><span class="badge free">${L('每日免费','Free each day')}</span><h2 style="font-size:42px;margin-top:18px">${L('看看今天最值得留意的线索','See what deserves your attention today')}</h2><p>${L('把它当作一个观察角度，不必当成答案。真正重要的，是它让你想起了什么。','Take it as a point of view, not an answer. What matters is what it brings to mind for you.')}</p><button class="primary-btn" onclick="revealDaily()">${L('翻开今天的牌','Reveal today’s card')}</button></div></div>`:`<div id="dailyResult" class="daily-card panel"><div class="daily-visual">${renderTarotCard({index:d.cardIndex,orientation:d.orientation,position:L('今天','Today')})}</div><div><div class="daily-date">${fmtDate(new Date().toISOString())} · ${rev?L('逆位','Reversed'):L('正位','Upright')}</div><h2 style="font-size:44px;margin-top:10px">${L(card.zh,card.en)}</h2><div class="result-section"><h3>${L('今天的线索','What comes into view')}</h3><p>${L(card.upZh,card.upEn)}</p></div><div class="result-section"><h3>${L('换一个角度','Another way to see it')}</h3><p>${L(card.altZh,card.altEn)}</p></div><div class="result-section"><h3>${L('留给自己的一问','A question to sit with')}</h3><p>${L(card.qZh,card.qEn)}</p></div><div class="result-section"><h3>${L('带进生活的一小步','One small step for today')}</h3><p>${L(card.aZh,card.aEn)}</p></div><p class="hint" style="margin-top:18px">${L('这份解读会一直留到今天结束。','This reading stays with you for the rest of the day.')}</p><div class="button-row"><button class="primary-btn" onclick="createIntentionFromText('${esc(L(card.qZh,card.qEn)).replace(/'/g,"\\'")}','daily-${d.date}')">${L('把它写成意图','Carry it into an intention')}</button><button class="soft-btn" onclick="openDeepForDaily()">${L('多看一层 · 1 Credit','Go deeper · 1 Credit')}</button></div></div></div>`}</div></div>`}
function openDeepForDaily(){state.deep.selected='deep_one';state.deep.context=L('围绕今天的牌，结合我正在关注的事情提供更贴近语境的反思。','Use today’s card and what I am currently considering to offer a more contextual reflection.');saveState();go('deep')}

const THEMES=[['self','自我与方向','Self & direction'],['work','工作与创造','Work & creation'],['relationship','关系与边界','Relationships & boundaries'],['change','变化与选择','Change & choice'],['rest','恢复与节奏','Rest & rhythm']];
function evaluateQuestion(q){const x=q.toLowerCase();if(!x)return{status:'allowed',message:''};const crisis=['suicide','kill myself','自杀','不想活','伤害自己'];const high=['diagnose','cancer','lawsuit','legal outcome','stock','investment return','will i die','疾病','诊断','官司','股票','投资回报','死亡'];const control=['does he love','will she return','make them','control him','他爱我吗','她会回来吗','让他','控制她'];if(crisis.some(v=>x.includes(v)))return{status:'crisis',message:L('这件事需要真实的人陪在你身边，而不是一次解读。若你正处于立即危险中，请联系当地紧急服务，或告诉一个现在能陪你的人。','This deserves real human support, not a reading. If you are in immediate danger, contact local emergency services or someone who can stay with you now.')};if(high.some(v=>x.includes(v)))return{status:'blocked',message:L('这个问题需要专业判断，不能交给塔罗。你可以换成：在我能掌控的范围内，下一步怎样更安全、更有依据？','This question needs professional judgment, not Tarot. Try: What safer, evidence-based next step is within my control?')};if(control.some(v=>x.includes(v)))return{status:'reframed',message:L('我们不会揣测或左右另一个人的内心。可以改问：在这段关系里，我怎样照顾自己的感受、边界与选择？','We won’t claim to know or influence another person’s inner life. Try: How can I care for my feelings, boundaries, and choices in this relationship?')};return{status:'allowed',message:''}}
function setTarotTheme(v){state.tarot.theme=v;saveState();renderApp()}
function setTarotSpread(v){state.tarot.spread=Number(v);saveState();renderApp()}
function drawTarot(){const q=document.getElementById('tarotQuestion')?.value.trim()||'';state.tarot.question=q;const safety=evaluateQuestion(q);if(['crisis','blocked'].includes(safety.status)){state.tarot.result={blocked:true,safety,createdAt:new Date().toISOString()};saveState();renderApp();return}const indices=[];while(indices.length<state.tarot.spread){const i=randomInt(TAROT.length);if(!indices.includes(i))indices.push(i)}const positions=state.tarot.spread===1?[L('此刻的焦点','A focus for now')]:[L('此刻正在发生什么','What is happening now'),L('可以迈出的一步','A step you can take'),L('尚未打开的可能','What may become possible')];const cards=indices.map((index,i)=>({index,orientation:randomInt(2)?'upright':'reversed',position:positions[i]}));const r={id:uid('tarot'),theme:state.tarot.theme,question:q,safety,spread:state.tarot.spread,cards,createdAt:new Date().toISOString(),deckVersion:'major-arcana-v1',contentVersion:'reviewed-content-v3'};state.tarot.result=r;state.tarot.history.unshift(r);state.tarot.history=state.tarot.history.slice(0,20);saveState();renderApp();setTimeout(()=>document.getElementById('tarotResult')?.scrollIntoView({behavior:state.settings.reduceMotion?'auto':'smooth',block:'start'}),50)}
function clearTarot(){state.tarot.result=null;saveState();renderApp()}
function renderTarotCard(item){const c=TAROT[item.index],rev=item.orientation==='reversed';return `<article class="tarot-card ${rev?'reversed':''}"><div class="card-position">${esc(item.position||'')}</div><div class="card-inner"><div class="card-num">${c.n}</div><div class="card-symbol">${c.s}</div><h4>${L(c.zh,c.en)}</h4><div class="orientation">${rev?L('逆位','Reversed'):L('正位','Upright')}</div></div></article>`}
function basicCardMeaning(item){const c=TAROT[item.index];return `<div class="result-section"><h3>${esc(item.position)}</h3><p><strong>${L(c.zh,c.en)} · ${item.orientation==='reversed'?L('逆位','Reversed'):L('正位','Upright')}</strong><br>${L(c.upZh,c.upEn)}</p><p style="margin-top:9px"><span class="hint">${L('另一种角度','Another angle')}</span><br>${L(c.altZh,c.altEn)}</p></div>`}
function openDeepFromTarot(){if(!state.tarot.result||state.tarot.result.blocked)return;state.deep.selected=state.tarot.result.spread===1?'deep_one':'deep_three';state.deep.context=state.tarot.question||L('请把这次抽牌放进我当前的生活语境里理解。','Place this reading in the context of my current life.');saveState();go('deep')}
function renderTarot(){const r=state.tarot.result;return `<div class="page"><div class="shell">${crumbs([L('解读','Readings'),L('塔罗','Tarot')])}<div class="page-heading"><div><div class="eyebrow">${L('一张或三张 · 基础解读免费','One or three cards · Core reading free')}</div><h1>${L('把牌当作一面镜子，而不是判词','Use the cards as a mirror, not a verdict')}</h1></div><p>${L('一张牌和三张牌都会完整显示牌面和基础含义。想结合自己的处境多看一层时，再选择深度解读。','One- and three-card readings show every card and core meaning in full. Choose a Deep Reading only when you want to bring in more of your own context.')}</p></div><div class="reading-layout"><aside class="panel"><div class="field"><div class="field-label">${L('此刻最想靠近的主题','What feels closest right now')}</div><div class="chips">${THEMES.map(t=>`<button class="chip ${state.tarot.theme===t[0]?'active':''}" onclick="setTarotTheme('${t[0]}')">${L(t[1],t[2])}</button>`).join('')}</div></div><div class="field"><label for="tarotQuestion">${L('心里有一个具体的问题吗？（可留空）','Is there a particular question on your mind? (optional)')}</label><textarea id="tarotQuestion" maxlength="500" placeholder="${L('例如：面对这次变化，我真正需要看清什么？','For example: What do I need to see clearly about this change?')}">${esc(state.tarot.question)}</textarea><span class="hint">${L('你的问题只保存在这台设备上；需要专业判断的内容会被引导到更安全的问法。','Your question stays on this device; anything requiring professional judgment is redirected toward a safer framing.')}</span></div><div class="field"><div class="field-label">${L('选择阅读方式','Choose your reading')}</div><div class="segmented"><button class="${state.tarot.spread===1?'active':''}" onclick="setTarotSpread(1)">${L('一张牌 · 此刻','One card · The present')}</button><button class="${state.tarot.spread===3?'active':''}" onclick="setTarotSpread(3)">${L('三张牌 · 展开','Three cards · A fuller view')}</button></div></div><button class="primary-btn" style="width:100%" onclick="drawTarot()">${L('留一口呼吸，抽牌','Take a breath and draw')}</button><div class="notice" style="margin-top:16px"><span>ⓘ</span><div>${L('牌面由随机抽取产生；深度解读只会在牌面展开后，整理你愿意分享的背景。','Cards are drawn at random. Deep Readings only bring in the context you choose to share after the cards are open.')}</div></div></aside><section>${!r?`<div class="panel empty"><h2>${L('牌会在这里慢慢翻开','Your cards will open here')}</h2><p>${L('选好主题和阅读方式，留一口呼吸，再抽牌。','Choose a theme and reading, take a breath, then draw.')}</p></div>`:r.blocked?`<div class="panel"><div class="notice ${r.safety.status==='crisis'?'danger':'warn'}"><span>⚑</span><div><strong>${L('这次先不抽牌','Let’s pause this reading')}</strong>${r.safety.message}</div></div><div class="button-row"><button class="ghost-btn" onclick="clearTarot()">${L('换一种问法','Try another question')}</button></div></div>`:`<div id="tarotResult"><div class="panel"><div class="tarot-reveal">${r.cards.map(renderTarotCard).join('')}</div><div class="notice"><span>✓</span><div><strong>${L('你的牌已经完整展开','Your reading is fully open')}</strong>${L('这些内容会一直保留，不需要使用 Credits。','This reading stays with you and uses no Credits.')}</div></div>${r.cards.map(basicCardMeaning).join('')}<div class="result-section"><h3>${L('可以带走的问题','A question to carry')}</h3><p>${L(TAROT[r.cards[0].index].qZh,TAROT[r.cards[0].index].qEn)}</p></div><div class="result-section"><h3>${L('落在现实里的一步','A grounded next step')}</h3><p>${L(TAROT[r.cards[0].index].aZh,TAROT[r.cards[0].index].aEn)}</p></div><div class="ai-divider"><div class="ai-label"><span>AI</span>${L('结合你的处境，多看一层','Bring in your context')}</div><p>${L(`如果你希望把问题与${r.spread===1?'这张牌':'三张牌之间的关系'}放在一起理解，可以另外使用 ${r.spread===1?1:2} Credit${r.spread===1?'':'s'}。免费内容不会消失。`,`If you want to understand your question together with ${r.spread===1?'this card':'the relationship among these cards'}, you may use ${r.spread===1?1:2} Credit${r.spread===1?'':'s'}. The free result remains available.`)}</p><div class="button-row"><button class="soft-btn" onclick="openDeepFromTarot()">${r.spread===1?L('个性化深读 · 1 Credit','Personalized depth · 1 Credit'):L('三张牌综合 · 2 Credits','Three-card synthesis · 2 Credits')}</button><button class="primary-btn" onclick="createIntentionFromText('${esc(L(TAROT[r.cards[0].index].qZh,TAROT[r.cards[0].index].qEn)).replace(/'/g,"\\'")}','tarot-${r.id}')">${L('把它写成意图','Carry it into an intention')}</button><button class="ghost-btn" onclick="clearTarot()">${L('收起这次解读','Close this reading')}</button></div></div></div></div>`}</section></div></div></div>`}
function selectDeep(code){state.deep.selected=code;state.deep.lastFailure=null;saveState()}
function deepProduct(code){return DEEP_PRODUCTS.find(p=>p.code===code)}
function deepSourceSummary(code){
 if(['deep_one','deep_three'].includes(code)&&state.tarot.result&&!state.tarot.result.blocked){const r=state.tarot.result;return L(`最近塔罗：${r.cards.map(c=>TAROT[c.index].zh).join('、')}`,`Recent Tarot: ${r.cards.map(c=>TAROT[c.index].en).join(', ')}`)}
 if(code==='deep_one'&&state.daily.revealed){return L(`今天的牌：${TAROT[state.daily.cardIndex].zh}`,`Today’s card: ${TAROT[state.daily.cardIndex].en}`)}
 return L('不自动读取私密日志或出生资料','Does not automatically read private journals or birth data');
}
