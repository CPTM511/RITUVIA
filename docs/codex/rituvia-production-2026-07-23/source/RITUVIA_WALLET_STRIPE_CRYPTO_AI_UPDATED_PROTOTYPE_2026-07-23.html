function renderNumerology(){const r=state.numerology.result;return `<div class="page"><div class="shell">${crumbs([L('解读','Readings'),L('数字命理','Numerology')])}<div class="page-heading"><div><div class="eyebrow">${L('每一步，都清楚可见','Every step, clearly shown')}</div><h1>${L('读一读日期里的节奏','Read the rhythm in your numbers')}</h1></div><p>${L('从出生日期出发，看看生命路径、生日数和今年的个人年。计算过程会一并展开，让你知道每一个数字从哪里来。','Begin with your birth date to see your Life Path, Birthday Number, and Personal Year. Every step is shown, so you can see where each number comes from.')}</p></div><div class="reading-layout"><aside class="panel"><div class="field"><label for="numBirth">${L('出生日期','Birth date')}</label><input id="numBirth" type="date" value="${esc(state.numerology.birthDate)}"></div><div class="field"><label for="numName">${L('姓名（可选）','Name (optional)')}</label><input id="numName" value="${esc(state.numerology.name)}" placeholder="Avery Stone"><span class="hint">${L('这里只支持拉丁字母姓名；不填写也不影响日期计算。','This optional calculation currently supports Latin-letter names. You can leave it blank without affecting the date-based results.')}</span></div><button class="primary-btn" onclick="calculateNumerology()">${L('看看我的数字','Calculate my numbers')}</button><div class="notice" style="margin-top:18px"><span>ⓘ</span><div>${L('把数字当作一种观察方式，而不是固定性格或命运。只留下与你的真实经验相符的部分。','Use the numbers as a way of looking, not a fixed identity or destiny. Keep only what fits your lived experience.')}</div></div></aside><section>${r?`<div class="panel"><span class="badge free">${L('计算结果','Your numbers')}</span><h2 style="font-size:42px;margin-top:14px">${L('你的数字组合','Your number pattern')}</h2><div class="number-results">${numberTile('生命路径','Life Path',r.life)}${numberTile('生日数','Birthday Number',r.birthday)}${numberTile('个人年','Personal Year',r.personalYear)}${r.expression?numberTile('表达数','Expression Number',r.expression):''}</div><div class="notice"><span>✦</span><div>${L('姓名表达数沿用拉丁字母系统，因此不适合直接套用到中文姓名或其他文字体系。','The Expression Number follows a Latin-letter system and should not be applied directly to Chinese names or other writing systems.')}</div></div><div class="button-row"><button class="primary-btn" onclick="createIntentionFromNumerology()">${L('把一个主题写成意图','Carry one theme into an intention')}</button><button class="ghost-btn" onclick="state.numerology.result=null;saveState();renderApp()">${L('重新计算','Start again')}</button></div></div>`:`<div class="panel empty"><div class="method-icon" style="margin:0 auto 20px">#</div><h2>${L('结果会在这里展开','Your numbers will unfold here')}</h2><p>${L('填写出生日期后，你会同时看到计算过程和一段可以对照真实经验阅读的解释。','Enter your birth date to see both the calculation and a reflection you can compare with your own experience.')}</p></div>`}</section></div></div></div>`}
function sunSign(month,day){const edges=[[1,20,'capricorn','aquarius'],[2,19,'aquarius','pisces'],[3,21,'pisces','aries'],[4,20,'aries','taurus'],[5,21,'taurus','gemini'],[6,21,'gemini','cancer'],[7,23,'cancer','leo'],[8,23,'leo','virgo'],[9,23,'virgo','libra'],[10,23,'libra','scorpio'],[11,22,'scorpio','sagittarius'],[12,22,'sagittarius','capricorn']];const e=edges[month-1];return day<e[1]?e[2]:e[3]}
const SIGN_COPY={aries:['白羊座','Aries','行动、直接与开始','action, directness, and beginning'],taurus:['金牛座','Taurus','稳定、感官与价值','stability, embodiment, and values'],gemini:['双子座','Gemini','好奇、语言与连接','curiosity, language, and connection'],cancer:['巨蟹座','Cancer','保护、归属与感受','protection, belonging, and feeling'],leo:['狮子座','Leo','创造、表达与被看见','creativity, expression, and visibility'],virgo:['处女座','Virgo','辨别、照料与改进','discernment, care, and refinement'],libra:['天秤座','Libra','关系、平衡与选择','relationship, balance, and choice'],scorpio:['天蝎座','Scorpio','深度、边界与转化','depth, boundaries, and transformation'],sagittarius:['射手座','Sagittarius','意义、探索与远景','meaning, exploration, and perspective'],capricorn:['摩羯座','Capricorn','责任、时间与建造','responsibility, time, and building'],aquarius:['水瓶座','Aquarius','独立、群体与新结构','independence, community, and new structures'],pisces:['双鱼座','Pisces','想象、共情与流动','imagination, empathy, and flow']};
function calculateAstrology(){const birth=document.getElementById('astroBirth')?.value||'',time=document.getElementById('astroTime')?.value||'12:00',mode=document.querySelector('input[name="astroMode"]:checked')?.value||'exact',place=document.getElementById('astroPlace')?.value.trim()||'';if(!birth){toast(L('先填写出生日期。','Enter a birth date first.'));return}const [y,m,d]=birth.split('-').map(Number),sign=sunSign(m,d);const result={id:uid('astro'),birthDate:birth,birthTime:time,timeMode:mode,place,sun:sign,createdAt:new Date().toISOString()};state.astrology={...state.astrology,birthDate:birth,birthTime:time,timeMode:mode,place,result,history:[result,...state.astrology.history].slice(0,20)};saveState();renderApp()}
function astroWheel(result){const signs=['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'];return `<svg class="astro-wheel" viewBox="0 0 420 420" role="img" aria-label="${L('太阳星座圆盘','Sun-sign wheel')}"><defs><radialGradient id="ag"><stop stop-color="#242a40"/><stop offset="1" stop-color="#090b12"/></radialGradient></defs><circle cx="210" cy="210" r="190" fill="url(#ag)" stroke="#e3c27a" stroke-opacity=".48"/><circle cx="210" cy="210" r="142" fill="none" stroke="#9e91e8" stroke-opacity=".38"/><circle cx="210" cy="210" r="76" fill="none" stroke="#79c8c2" stroke-opacity=".32"/>${Array.from({length:12},(_,i)=>{const a=i*Math.PI/6-Math.PI/2,x1=210+76*Math.cos(a),y1=210+76*Math.sin(a),x2=210+190*Math.cos(a),y2=210+190*Math.sin(a),tx=210+166*Math.cos(a+Math.PI/12),ty=216+166*Math.sin(a+Math.PI/12);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="white" stroke-opacity=".11"/><text x="${tx}" y="${ty}" fill="#a9adba" font-size="17" text-anchor="middle">${signs[i]}</text>`}).join('')}<text x="210" y="205" fill="#ffe3a4" text-anchor="middle" font-size="30">${esc(L(SIGN_COPY[result.sun][0],SIGN_COPY[result.sun][1]))}</text><text x="210" y="230" fill="#a9adba" text-anchor="middle" font-size="11">SUN SIGN</text></svg>`}
function createIntentionFromAstrology(){const r=state.astrology.result;if(!r)return;const x=SIGN_COPY[r.sun];createIntentionFromText(L(`我想更留意${x[2]}在生活里怎样出现。`,`I want to notice how ${x[3]} shows up in my life.`),`astrology-${r.id}`)}
function renderAstrology(){const r=state.astrology.result;return `<div class="page"><div class="shell">${crumbs([L('解读','Readings'),L('西方占星','Western Astrology')])}<div class="page-heading"><div><div class="eyebrow">${L('从太阳星座开始','Begin with your Sun sign')}</div><h1>${L('从出生日期，打开一个更长的观察角度','Begin a longer view from your birth date')}</h1></div><p>${L('太阳星座不是一张固定的人格标签。把它当作一组值得留意的主题，再回到自己的经验里判断哪些真正属于你。','A Sun sign is not a fixed personality label. Treat it as a set of themes to notice, then decide from your own experience what genuinely fits.')}</p></div><div class="reading-layout"><aside class="panel"><div class="field"><label for="astroBirth">${L('出生日期','Birth date')}</label><input id="astroBirth" type="date" value="${esc(state.astrology.birthDate)}"></div><p class="hint">${L('这次会从太阳星座开始。它适合用来观察长期反复出现的主题，而不是定义你是谁。','This reading begins with your Sun sign. Use it to notice longer-running themes, not to define who you are.')}</p><button class="primary-btn" onclick="calculateAstrology()">${L('查看我的太阳主题','See my Sun-sign themes')}</button></aside><section>${r?`<div class="panel"><div class="astro-grid"><div class="astro-core">${astroWheel(r)}</div><div><span class="badge info">${L('太阳星座','Sun sign')}</span><h2 style="font-size:44px;margin-top:14px">${L(SIGN_COPY[r.sun][0],SIGN_COPY[r.sun][1])}</h2><p class="lede" style="font-size:18px">${L(`这组主题常与${SIGN_COPY[r.sun][2]}有关。看看哪些地方让你认出自己，哪些地方并不适合你。`,`This sign is often associated with ${SIGN_COPY[r.sun][3]}. Notice what feels familiar—and what does not fit you at all.`)}</p><div class="result-section"><h3>${L('可以留意的主题','Themes to notice')}</h3><p>${L(`在接下来一段时间里，留意${SIGN_COPY[r.sun][2]}如何出现在你的选择、关系和日常节奏中。`,`Over the coming days, notice how ${SIGN_COPY[r.sun][3]} appears in your choices, relationships, and everyday rhythm.`)}</p></div><div class="result-section"><h3>${L('留给自己的一问','A question to sit with')}</h3><p>${L('如果不需要证明自己符合某个星座描述，你最想诚实地承认什么？','If you did not need to fit any sign description, what would you most honestly admit?')}</p></div></div></div><div class="button-row"><button class="primary-btn" onclick="createIntentionFromAstrology()">${L('把这个主题写成意图','Carry this into an intention')}</button><button class="ghost-btn" onclick="state.astrology.result=null;saveState();renderApp()">${L('重新填写','Start again')}</button></div></div>`:`<div class="panel empty"><div class="method-icon" style="margin:0 auto 20px">☉</div><h2>${L('你的太阳主题会在这里展开','Your Sun-sign themes will appear here')}</h2><p>${L('填写出生日期，看看这组象征语言能为你带来哪些值得思考的问题。','Enter your birth date and see which questions this symbolic language brings into view.')}</p></div>`}</section></div></div></div>`}
function createIntentionFromText(text,source='manual'){const cleaned=String(text||'').trim();if(!cleaned)return;const item={id:uid('intention'),text:cleaned,action:'',source,createdAt:new Date().toISOString(),revisitDate:''};state.intentions.unshift(item);state.activeIntentionId=item.id;saveState();go('sanctuary');toast(L('已经带到圣所，你可以再用自己的话调整。','Carried into the sanctuary. You can revise it in your own words.'))}
function saveIntention(){const text=document.getElementById('intentionText')?.value.trim()||'',action=document.getElementById('intentionAction')?.value.trim()||'',revisitDate=document.getElementById('intentionRevisit')?.value||'';if(!text||!action){toast(L('写下一份意图和一小步行动。','Write an intention and one small action.'));return}let item=activeIntention();if(item){item.text=text;item.action=action;item.revisitDate=revisitDate;item.updatedAt=new Date().toISOString()}else{item={id:uid('intention'),text,action,revisitDate,source:'manual',createdAt:new Date().toISOString()};state.intentions.unshift(item);state.activeIntentionId=item.id}saveState();renderApp();toast(L('这份意图已经留在这里。','Your intention is saved here.'))}
function newIntention(){state.activeIntentionId=null;saveState();renderApp()}

function allRitualItems(){return [...OBJECTS,...SPECIAL_RITUALS]}
function ritualItem(code){return allRitualItems().find(x=>x.code===code)}
function ritualAccess(item){if(item.type==='free')return true;if(item.type==='permanent')return state.ownedObjects.includes(item.code);return (state.ritualPasses[item.code]||0)>0}
function showRitualItem(code){const item=ritualItem(code);if(!item)return;const owned=ritualAccess(item),typeLabel=item.type==='free'?L('免费体验','Free experience'):item.type==='permanent'?L('永久收藏','Permanent collection'):L('一次使用','One-time experience');const access=item.type==='free'?L('随时可用','Available anytime'):item.type==='permanent'?L('加入收藏后，可以随时回来使用','Return to it anytime after unlocking'):L('每次解锁，使用一次','One use each time you unlock it');showModal(L(item.zh,item.en),`<div class="product-art" style="font-size:74px;text-align:center;padding:24px" aria-hidden="true">${item.icon}</div><span class="badge ${item.type==='free'?'free':'credit'}">${typeLabel}${item.credits?` · ${item.credits} Credits`:''}</span><h2 style="font-size:40px;margin-top:14px">${L(item.zh,item.en)}</h2><p>${L(item.descZh,item.descEn)}</p><dl class="key-list"><div class="key-row"><dt>${L('使用方式','Access')}</dt><dd>${access}</dd></div><div class="key-row"><dt>${L('时长','Duration')}</dt><dd>${item.duration}</dd></div><div class="key-row"><dt>${L('声音','Audio')}</dt><dd>${item.audio?L('可选，随时可以关闭','Optional; turn it off anytime'):L('无需声音','No audio needed')}</dd></div><div class="key-row"><dt>${L('舒适设置','Comfort settings')}</dt><dd>${L('可以减少动态效果，也可以只看文字引导。','Reduced motion and a text-led experience are available.')}</dd></div></dl><div class="notice"><span>✦</span><div>${L('这些物件只改变画面、声音和仪式氛围，不会改变任何现实结果。','These objects change the art, sound, and atmosphere—not any real-world outcome.')}</div></div>`,owned?`<button class="ghost-btn" onclick="closeModal()">${L('返回','Back')}</button><button class="primary-btn" onclick="closeModal();selectRitualItem('${item.code}')">${item.type==='consumable'?L(`开始一次 · 剩余 ${state.ritualPasses[item.code]||0}`,`Begin one · ${state.ritualPasses[item.code]||0} remaining`):L('在圣所使用','Use in the Sanctuary')}</button>`:`<button class="ghost-btn" onclick="closeModal()">${L('暂时不选','Not now')}</button><button class="primary-btn" onclick="confirmRitualPurchase('${item.code}')">${item.type==='permanent'?L(`加入收藏 · ${item.credits} Credits`,`Add to collection · ${item.credits} Credits`):L(`解锁一次 · ${item.credits} Credits`,`Unlock one use · ${item.credits} Credits`)}</button>`)}
function confirmRitualPurchase(code){const item=ritualItem(code);if(!item||item.credits<=0)return;if(!ensureAccount({kind:'ritual_purchase',code}))return;const remaining=creditTotal()-item.credits;if(remaining<0){closeModal();showModal(L('Credits 不足','Not enough Credits'),`<p>${L(`这项体验需要 ${item.credits} Credits，你目前有 ${creditTotal()}。`,`This experience uses ${item.credits} Credits, and you currently have ${creditTotal()}.`)}</p>`,`<button class="ghost-btn" onclick="closeModal()">${L('返回','Back')}</button><button class="primary-btn" onclick="closeModal();go('plans')">${L('查看 Plus 与 Credits','See Plus & Credits')}</button>`);return}showModal(L('确认这次选择','Confirm your choice'),`<h2 style="font-size:38px">${L(item.zh,item.en)}</h2><p>${item.type==='permanent'?L(`加入收藏会使用 ${item.credits} Credits。完成后还剩 ${remaining} Credits。`,`Adding this to your collection uses ${item.credits} Credits. You will have ${remaining} Credits remaining.`):L(`这次仪式需要 ${item.credits} Credits。完成后还剩 ${remaining} Credits。`,`This ritual uses ${item.credits} Credits. You will have ${remaining} Credits remaining.`)}</p><div class="notice"><span>ⓘ</span><div>${item.type==='permanent'?L('解锁后会一直留在你的收藏里。','Once unlocked, it stays in your collection.'):L('只有当仪式真正开始时，这次使用才会被记下。','The use is counted only when the ritual actually begins.')}</div></div>`,`<button class="ghost-btn" onclick="closeModal()">${L('取消','Cancel')}</button><button class="primary-btn" onclick="purchaseRitualItem('${code}')">${L('确认','Confirm')}</button>`)}
function purchaseRitualItem(code){const item=ritualItem(code);if(!item)return;const r=reserveCredits(item.credits,item.code);if(!r){closeModal();toast(L('Credits 不足。','Not enough Credits.'));return}finalizeReservation(r.id,uid('entitlement'));if(item.type==='permanent'&&!state.ownedObjects.includes(item.code))state.ownedObjects.push(item.code);if(item.type==='consumable')state.ritualPasses[item.code]=(state.ritualPasses[item.code]||0)+1;state.orders.unshift({id:uid('credit_use'),kind:item.type==='permanent'?'permanent_object':'special_ritual',productCode:item.code,titleZh:item.zh,titleEn:item.en,credits:item.credits,status:'completed',createdAt:new Date().toISOString(),refundable:false});saveState();closeModal();selectRitualItem(item.code);toast(item.type==='permanent'?L('已经加入你的收藏。','Added to your collection.'):L('这次仪式已经准备好。','Your ritual is ready.'))}
function selectRitualItem(code){const item=ritualItem(code);if(!item||!ritualAccess(item)){showRitualItem(code);return}state.ritual.selected=code;state.ritual.status='setup';state.ritual.elapsed=0;state.ritual.running=false;state.ritual.activePass=null;saveState();renderApp()}
function ritualVisual(item){if(item.code.includes('candle')||item.code==='guided_light')return '🕯️';if(item.code.includes('incense')||item.code==='offering')return item.icon;return item.icon}
function fmtTimer(seconds){const m=Math.floor(seconds/60),s=seconds%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function startRitual(){const item=ritualItem(state.ritual.selected)||OBJECTS[0],intent=activeIntention();if(!intent||!intent.text||!intent.action){toast(L('先保存一份意图和一小步行动。','Save an intention and one small action first.'));return}if(!ritualAccess(item)){showRitualItem(item.code);return}if(item.type==='consumable'){const passes=state.ritualPasses[item.code]||0;if(passes<1){showRitualItem(item.code);return}state.ritualPasses[item.code]=passes-1;state.ritual.activePass={code:item.code,consumedAt:new Date().toISOString(),useId:uid('ritual_use')}}state.ritual.status='active';state.ritual.running=true;state.ritual.startedAt=new Date().toISOString();state.ritual.sessionId=uid('ritual');saveState();renderApp();startRitualTimer()}
function startRitualTimer(){clearInterval(ritualInterval);if(!state.ritual.running)return;ritualInterval=setInterval(()=>{state.ritual.elapsed+=1;const el=document.getElementById('ritualTimer');if(el)el.textContent=fmtTimer(state.ritual.elapsed);if(state.ritual.elapsed%5===0)saveState()},1000)}
function pauseResumeRitual(){if(state.ritual.status!=='active'&&state.ritual.status!=='paused')return;state.ritual.running=!state.ritual.running;state.ritual.status=state.ritual.running?'active':'paused';saveState();renderApp();if(state.ritual.running)startRitualTimer();else clearInterval(ritualInterval)}
function completeRitual(){if(!['active','paused'].includes(state.ritual.status))return;clearInterval(ritualInterval);state.ritual.status='complete';state.ritual.running=false;state.ritual.completedAt=new Date().toISOString();const item=ritualItem(state.ritual.selected);state.orders.unshift({id:uid('ritual_history'),kind:'ritual_completion',productCode:item.code,titleZh:item.zh,titleEn:item.en,credits:0,status:'completed',createdAt:state.ritual.completedAt,refundable:false});saveState();renderApp()}
function leaveRitual(){clearInterval(ritualInterval);state.ritual.running=false;state.ritual.status=state.ritual.status==='active'?'paused':state.ritual.status;saveState();go('home')}
function resetRitual(){clearInterval(ritualInterval);state.ritual={...cloneDefault().ritual,selected:state.ritual.selected};saveState();renderApp()}
function toggleAmbient(){state.ritual.ambient=!state.ritual.ambient;saveState();renderApp();toast(state.ritual.ambient?L('氛围模式已开启。声音仍由你手动选择。','Ambience is on. Audio remains your choice.'):L('氛围模式已关闭。','Ambience is off.'))}
function toggleIntentionVisibility(){state.ritual.hiddenIntention=!state.ritual.hiddenIntention;saveState();renderApp()}
function renderRitualStage(){const item=ritualItem(state.ritual.selected)||OBJECTS[0],status=state.ritual.status,intent=activeIntention();return `<div class="ritual-stage"><div class="stage-top"><span class="badge ${item.type==='free'?'free':item.type==='permanent'?'info':'credit'}">${item.type==='free'?L('随时可用','Always here'):item.type==='permanent'?L('我的收藏','In my collection'):L(`可使用 ${state.ritualPasses[item.code]||0} 次`,`${state.ritualPasses[item.code]||0} use${(state.ritualPasses[item.code]||0)===1?'':'s'} available`)}</span><div class="button-row" style="margin:0"><button class="ghost-btn" onclick="toggleIntentionVisibility()">${state.ritual.hiddenIntention?L('显示意图','Show intention'):L('隐藏意图','Hide intention')}</button><button class="ghost-btn" onclick="toggleAmbient()">${state.ritual.ambient?L('关闭氛围','Ambience off'):L('开启氛围','Ambience on')}</button></div></div><div class="stage-center"><div><div class="altar"><div class="ritual-object" aria-hidden="true">${ritualVisual(item)}</div></div><div class="ritual-copy"><span class="timer" id="ritualTimer">${fmtTimer(state.ritual.elapsed)}</span><h2>${status==='complete'?L('这段仪式到这里就好','This is a natural place to close'):L(item.zh,item.en)}</h2><p>${state.ritual.hiddenIntention?L('意图暂时收起了。','Your intention is hidden for now.'):intent?`“${esc(intent.text)}”<br><small>${esc(intent.action)}</small>`:L('先在右侧写下一份意图，以及你愿意做的一小步。','Begin by writing an intention and one small step you are willing to take.')}</p><p>${status==='setup'?L('准备好时再开始。这里只需要几分钟，也不必完成任何打卡。','Begin when you feel ready. A few minutes is enough, and there is nothing to keep up with.'):status==='complete'?L('你可以写下此刻留下的东西，或选一天回来看看。','Write what remains, or choose a day to return.'):L('慢一点呼吸。你可以暂停、提前结束，或只安静地待一会儿。','Breathe a little more slowly. Pause, finish early, or simply stay for a moment.')}</p><div class="button-row" style="justify-content:center">${status==='setup'?`<button class="primary-btn" onclick="startRitual()">${L('开始','Begin')}</button>`:''}${status==='active'||status==='paused'?`<button class="soft-btn" onclick="pauseResumeRitual()">${state.ritual.running?L('暂停','Pause'):L('继续','Resume')}</button><button class="primary-btn" onclick="completeRitual()">${L('到这里就好','Close the ritual')}</button><button class="ghost-btn" onclick="leaveRitual()">${L('稍后再来','Leave for now')}</button>`:''}${status==='complete'?`<button class="primary-btn" onclick="go('journal')">${L('写下此刻','Write about this')}</button><button class="soft-btn" onclick="go('revisit')">${L('以后再回来看看','Return to this later')}</button><button class="ghost-btn" onclick="resetRitual()">${L('回到圣所','Return to the sanctuary')}</button>`:''}</div></div></div></div></div>`}
function catalogItem(item){const available=ritualAccess(item),active=state.ritual.selected===item.code,meta=item.type==='free'?L('免费','Free'):item.type==='permanent'?(available?L('已收藏','Collected'):`${item.credits} Credits`):(available?L(`${state.ritualPasses[item.code]} 次可用`,`${state.ritualPasses[item.code]} use${state.ritualPasses[item.code]===1?'':'s'}`):`${item.credits} Credits`);return `<div class="catalog-item ${active?'active':''}"><div class="catalog-icon">${item.icon}</div><div><h4>${L(item.zh,item.en)}</h4><small>${meta}</small></div><button onclick="${available?`selectRitualItem('${item.code}')`:`showRitualItem('${item.code}')`}">${available?L('使用','Use'):L('查看','View')}</button></div>`}
function renderSanctuary(){const a=activeIntention();return `<div class="page"><div class="shell">${crumbs([L('圣所','Sanctuary')])}<div class="page-heading"><div><div class="eyebrow">${L('一处安静的停顿','A quiet pause')}</div><h1>${L('为一个清楚的意图，留一点时间','Make time for one clear intention')}</h1></div><p>${L('从一束免费烛光或一缕香开始，也可以从自己的收藏中选择一件物件。特别仪式更适合某一个具体时刻。','Begin with a free candle or incense, choose something from your collection, or save a special ritual for a particular moment.')}</p></div><div class="sanctuary-layout"><section>${renderRitualStage()}</section><aside><div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h3>${L('这次想为自己留下什么？','What do you want to hold onto?')}</h3><button class="ghost-btn" onclick="newIntention()">${L('写新的','Begin a new one')}</button></div><div class="field"><label for="intentionText">${L('意图','Intention')}</label><textarea id="intentionText" maxlength="400" placeholder="${L('我想把更多……带进生活','I want to make more room for…')}">${esc(a?.text||'')}</textarea></div><div class="field"><label for="intentionAction">${L('接下来愿意做的一小步','One small step you are willing to take')}</label><input id="intentionAction" maxlength="240" value="${esc(a?.action||'')}" placeholder="${L('例如：明早把那封邮件发出去','For example: Send the email tomorrow morning')}"><span class="hint">${L('把行动放在自己可以选择的部分。','Keep the action within what you can choose.')}</span></div><div class="field"><label for="intentionRevisit">${L('何时回来看看（可选）','When would you like to return? (optional)')}</label><input id="intentionRevisit" type="date" value="${esc(a?.revisitDate||'')}"></div><button class="primary-btn" onclick="saveIntention()">${L('保存这份意图','Keep this intention')}</button></div><div class="panel catalog-section"><h3>${L('随时可用','Always here')}</h3><div class="catalog-scroll">${OBJECTS.filter(x=>x.type==='free').map(catalogItem).join('')}</div><h3 style="margin-top:26px">${L('你的收藏','Your collection')}</h3><div class="catalog-scroll">${OBJECTS.filter(x=>x.type==='permanent').map(catalogItem).join('')}</div><h3 style="margin-top:26px">${L('特别仪式','Special rituals')}</h3><div class="catalog-scroll">${SPECIAL_RITUALS.map(catalogItem).join('')}</div><p class="hint" style="margin-top:18px">${L('点开每一项，都能先看到所需 Credits、时长、声音和使用方式。','Open any item to see its Credit cost, duration, audio options, and how it can be used.')}</p></div></aside></div></div></div>`}
function checkoutProduct(code){const pack=CREDIT_PACKS.find(x=>x.code===code);if(pack)return{...pack,kind:'credit_pack',zh:`${pack.credits} Credits`,en:`${pack.credits} Credits`,descZh:'购买的 Credits 会留在你的账户中，不受 Plus 取消影响。',descEn:'Purchased Credits stay in your account and are not affected by Plus cancellation.'};const plan=PLUS_PLANS.find(x=>x.code===code);if(plan)return{...plan,kind:'plus',zh:`RITUVIA Plus · ${plan.zh}`,en:`RITUVIA Plus · ${plan.en}`,descZh:'每月获得 8 Credits，并保存更长的阅读、日志与回望历史。',descEn:'Includes 8 Credits each month, with longer reading, Journal, and Revisit history.'};return null}
function beginCheckout(code,skipAccount=false){const p=checkoutProduct(code);if(!p)return;if(!skipAccount&&!ensureAccount({kind:'checkout',code}))return;const existing=state.orders.find(o=>o.id===state.checkout.orderId&&o.status==='created');if(!existing){const order={id:uid('order'),kind:p.kind,productCode:p.code,titleZh:p.zh,titleEn:p.en,cents:p.cents,currency:'USD',status:'created',createdAt:new Date().toISOString(),termsVersion:'commerce-terms-v2',refundable:true,paymentMethod:null,paymentProvider:null};state.orders.unshift(order);state.checkout={productCode:code,status:'checkout_created',orderId:order.id,error:null,method:'stripe',saveMethod:p.kind==='plus'||state.payments.saveMethod}}saveState();go('checkout')}
function checkoutConsent(){const age=document.getElementById('checkoutAge')?.checked,terms=document.getElementById('checkoutTerms')?.checked;if(!age||!terms){toast(L('请先确认年龄与服务条款。','Confirm your age and the Terms first.'));return false}return true}
function submitPrototypeCheckout(shouldFail=false){if(!checkoutConsent())return;const order=state.orders.find(o=>o.id===state.checkout.orderId),p=checkoutProduct(state.checkout.productCode);if(!order||!p)return;if(state.checkout.method==='crypto'&&p.kind==='plus'){toast(L('Plus 订阅请使用 Stripe。USDC 可用于一次性购买 Credits。','Use Stripe for Plus subscriptions. USDC is available for one-time Credit purchases.'));return}if(state.checkout.method==='crypto'&&!state.payments.cryptoWallet){showWalletPicker('checkout');return}order.status='pending';order.checkoutCreatedAt=new Date().toISOString();order.paymentMethod=state.checkout.method;order.paymentProvider=state.checkout.method==='crypto'?'coinbase_checkout':'stripe';order.cryptoWallet=state.checkout.method==='crypto'?state.payments.cryptoWallet:null;state.checkout.status='pending';state.checkout.error=null;saveState();renderApp();setTimeout(()=>finishPrototypeWebhook(shouldFail),700)}
function finishPrototypeWebhook(shouldFail){const order=state.orders.find(o=>o.id===state.checkout.orderId),p=checkoutProduct(state.checkout.productCode);if(!order||!p)return;if(shouldFail){order.status='failed';order.failedAt=new Date().toISOString();state.checkout.status='failed';state.checkout.error='payment_failed';saveState();renderApp();return}order.status='paid';order.paidAt=new Date().toISOString();order.providerEventId=uid(order.paymentMethod==='crypto'?'checkout_evt':'stripe_evt');if(order.paymentMethod==='crypto'){order.txHash='0x'+hashText(order.id+order.cryptoWallet).toString(16).padStart(8,'0')+'6d91a3f78c2e5b40'}else if(state.checkout.saveMethod||p.kind==='plus'){if(!state.payments.savedMethods.length)state.payments.savedMethods.push({id:uid('pm'),kind:'card',label:'Visa',detail:'•••• 4242',createdAt:new Date().toISOString()});order.savedMethodLabel='Visa •••• 4242'}if(p.kind==='credit_pack'){addCredits('purchased_credit',p.credits,'credit_pack_purchase',p.code,order.id,null);order.creditsGranted=p.credits}else{const now=new Date(),next=new Date(now);next.setMonth(next.getMonth()+1);state.subscription={status:'active',plan:p.plan,startedAt:now.toISOString(),nextAllocation:next.toISOString(),cancelAt:null,orderId:order.id};addCredits('subscription_credit',8,'subscription_monthly_allocation',p.code,order.id,next.toISOString());order.creditsGranted=8}state.checkout.status='paid';saveState();renderApp()}
function abandonCheckout(){const o=state.orders.find(x=>x.id===state.checkout.orderId);if(o&&['created','checkout_created'].includes(o.status))o.status='cancelled';state.checkout={...cloneDefault().checkout,method:state.payments.method,saveMethod:state.payments.saveMethod};saveState();go('plans')}
function resetCheckoutForRetry(){const o=state.orders.find(x=>x.id===state.checkout.orderId);if(o)o.status='created';state.checkout.status='checkout_created';state.checkout.error=null;saveState();renderApp()}
function renderCheckout(){const p=checkoutProduct(state.checkout.productCode),order=state.orders.find(o=>o.id===state.checkout.orderId),status=state.checkout.status;if(!p||!order)return `<div class="page"><div class="shell"><div class="empty"><h1>${L('还没有选择方案','Nothing selected yet')}</h1><p>${L('回到 Plus 与 Credits，选择最适合你的方案。','Return to Plus & Credits and choose what fits you best.')}</p><a class="primary-btn" href="#plans">${L('查看方案','See options')}</a></div></div></div>`;if(status==='pending')return `<div class="page"><div class="shell"><div class="panel empty"><div class="spinner" style="margin:0 auto 18px"></div><h1>${L('正在确认你的购买','Confirming your purchase')}</h1><p>${state.checkout.method==='crypto'?L('正在等待 USDC 付款确认。完成后，Credits 会自动出现在你的账户里。','Waiting for the USDC payment to confirm. Your Credits will appear automatically when it is complete.'):L('Stripe 正在确认付款。完成后，Credits 或 Plus 会自动出现在你的账户里。','Stripe is confirming the payment. Your Credits or Plus access will appear automatically when it is complete.')}</p><span class="badge warn">${L('处理中','In progress')}</span></div></div></div>`;if(status==='paid')return `<div class="page"><div class="shell"><div class="panel empty"><div class="method-icon" style="margin:0 auto 20px">✓</div><h1>${p.kind==='credit_pack'?L('Credits 已经可以使用','Your Credits are ready'):L('欢迎加入 RITUVIA Plus','Welcome to RITUVIA Plus')}</h1><p>${p.kind==='credit_pack'?L(`已加入 ${p.credits} Credits。`,`We added ${p.credits} Credits to your account.`):L('本月 8 Credits 已加入账户。新的 Credits 会在每个订阅月开始时发放。','This month’s 8 Credits are in your account. New Credits are added at the start of each subscription month.')}</p><span class="identity-chip">${paymentMethodLabel(order)}</span><div class="button-row" style="justify-content:center"><a class="primary-btn" href="#account">${L('进入我的空间','Open my space')}</a><a class="ghost-btn" href="#orders">${L('查看订单','View order')}</a></div></div></div></div>`;if(status==='failed')return `<div class="page"><div class="shell"><div class="panel empty"><h1>${L('付款没有完成','Payment was not completed')}</h1><p>${L('你的账户没有发生变化。可以再试一次，或回到方案页面重新选择。','Nothing changed in your account. Try again or return to the plans page.')}</p><div class="button-row" style="justify-content:center"><button class="primary-btn" onclick="resetCheckoutForRetry()">${L('再试一次','Try again')}</button><button class="ghost-btn" onclick="abandonCheckout()">${L('返回方案','Back to plans')}</button></div></div></div></div>`;const cryptoAllowed=p.kind==='credit_pack',cryptoWallet=state.payments.cryptoWallet;return `<div class="page"><div class="shell">${crumbs([L('Plus 与 Credits','Plus & Credits'),L('结账','Checkout')])}<div class="page-heading"><div><div class="eyebrow">${L('安全结账','Secure checkout')}</div><h1>${L('确认你的选择','Review your selection')}</h1></div><p>${L('选择银行卡或数字钱包，也可以用 USDC 购买一次性 Credits。所有价格和权益都在确认前清楚显示。','Choose card or digital wallet, or use USDC for a one-time Credit purchase. Price and access are shown clearly before confirmation.')}</p></div><div class="checkout-shell"><section class="panel"><span class="badge info">${p.kind==='plus'?'RITUVIA Plus':'Credits'}</span><h2 style="font-size:44px;margin-top:14px">${L(p.zh,p.en)}</h2><p>${p.descZh?L(p.descZh,p.descEn):''}</p>${p.kind==='plus'?`<dl class="key-list"><div class="key-row"><dt>${L('续订','Renewal')}</dt><dd>${L(p.cadenceZh,p.cadenceEn)}</dd></div><div class="key-row"><dt>${L('每月包含','Included monthly')}</dt><dd>8 Credits</dd></div><div class="key-row"><dt>${L('付款','Payment')}</dt><dd>${L('通过 Stripe 使用银行卡、Apple Pay、Google Pay 或 Link','Card, Apple Pay, Google Pay, or Link through Stripe')}</dd></div><div class="key-row"><dt>${L('取消后','After cancellation')}</dt><dd>${L('使用到当前周期结束；购买的 Credits 不受影响','Access continues through the current period; purchased Credits are unaffected')}</dd></div></dl>`:`<dl class="key-list"><div class="key-row"><dt>Credits</dt><dd>${p.credits}</dd></div><div class="key-row"><dt>${L('可用于','Use them for')}</dt><dd>${L('深度解读、收藏物件和特别仪式','Deep Readings, collectible objects, and special rituals')}</dd></div><div class="key-row"><dt>${L('付款方式','Payment')}</dt><dd>${L('Stripe 或 USDC（Base）','Stripe or USDC on Base')}</dd></div></dl>`}<div class="payment-tabs"><button class="payment-tab ${state.checkout.method==='stripe'?'active':''}" onclick="setCheckoutMethod('stripe')"><strong>${L('银行卡与数字钱包','Card & digital wallets')}</strong><small>Stripe · Apple Pay · Google Pay · Link</small></button>${cryptoAllowed?`<button class="payment-tab ${state.checkout.method==='crypto'?'active':''}" onclick="setCheckoutMethod('crypto')"><strong>${L('使用 USDC','Pay with USDC')}</strong><small>Base · ${L('一次性购买','One-time purchase')}</small></button>`:''}</div>${state.checkout.method==='stripe'?`<div class="checkout-provider"><div class="provider-status">${L('由 Stripe 安全处理','Securely handled by Stripe')}</div><div class="payment-brand-row"><span class="payment-brand">Visa</span><span class="payment-brand">Mastercard</span><span class="payment-brand">Apple Pay</span><span class="payment-brand">Google Pay</span><span class="payment-brand">Link</span></div>${state.payments.savedMethods.length?`<div class="billing-row saved-method"><span class="method-icon-small">VISA</span><div><strong>${state.payments.savedMethods[0].label} ${state.payments.savedMethods[0].detail}</strong><small>${L('已保存的付款方式','Saved payment method')}</small></div><span class="badge ok">${L('可用','Ready')}</span></div>`:''}<label style="display:flex;gap:10px;align-items:flex-start;margin-top:16px"><input type="checkbox" ${state.checkout.saveMethod?'checked':''} ${p.kind==='plus'?'disabled':''} onchange="setSavePaymentMethod(this.checked)"><span>${p.kind==='plus'?L('订阅需要保存付款方式，以便续订。','A payment method is saved for subscription renewal.'):L('保存这张卡，方便以后使用。','Save this card for future purchases.')}</span></label></div>`:`<div class="crypto-box"><div class="chain-row"><div><span class="chain-pill">◉ USDC · Base</span><h3 style="margin-top:14px">${L('从常用钱包完成付款','Pay from a wallet you already use')}</h3></div><span class="badge info">${L('一次性付款','One-time')}</span></div><p>${L('付款金额会在钱包里再次确认。Credits 只会在链上付款确认后加入账户。','Your wallet will show the amount again before approval. Credits are added only after the onchain payment is confirmed.')}</p>${cryptoWallet?`<div class="wallet-row"><div><strong>${L('付款钱包','Payment wallet')}</strong><small class="wallet-address">${cryptoWallet}</small></div><button class="ghost-btn" onclick="showWalletPicker('checkout')">${L('更换','Change')}</button></div>`:`<button class="soft-btn" onclick="showWalletPicker('checkout')">${L('连接付款钱包','Connect payment wallet')}</button>`}<p class="payment-note" style="margin-top:14px">${L('网络费用由钱包显示。请只在 Base 网络使用 USDC。','Your wallet shows any network fee. Use USDC on Base only.')}</p></div>`}<div class="field" style="margin-top:20px"><label><input id="checkoutAge" type="checkbox"> ${L('我已满 18 岁。','I am 18 or older.')}</label></div><div class="field"><label><input id="checkoutTerms" type="checkbox"> ${L('我同意服务条款、隐私政策和适用的数字内容条款。','I agree to the Terms, Privacy Policy, and applicable digital-content terms.')}</label></div><div class="button-row"><button class="primary-btn" onclick="submitPrototypeCheckout(false)">${state.checkout.method==='crypto'?L('使用 USDC 继续','Continue with USDC'):L('前往 Stripe 安全结账','Continue to Stripe')}</button></div></section><aside class="panel checkout-summary"><span class="hint">${L('订单摘要','Order summary')}</span><div class="order-row"><span>${L(p.zh,p.en)}</span><strong>${money(p.cents)}</strong></div><div class="order-row"><span>${L('付款方式','Payment')}</span><span>${state.checkout.method==='crypto'?'USDC · Base':'Stripe'}</span></div><div class="order-row"><span>${L('税费','Taxes')}</span><span>${L('结账时显示','Shown at checkout')}</span></div><div class="order-row"><strong>${L('总计','Total')}</strong><strong>${money(p.cents)}</strong></div><button class="ghost-btn" style="margin-top:18px" onclick="abandonCheckout()">${L('取消并返回','Cancel and return')}</button></aside></div></div></div>`}

function creditSummary(){return `<div class="credit-summary"><div class="credit-main panel"><small>${L('可用 Credits','Available Credits')}</small><div class="value">${creditTotal()}</div><span>${L('用于深度解读、收藏物件和特别仪式','Use them for Deep Readings, collectible objects, and special rituals')}</span></div><div class="credit-type panel"><span>${L('Plus 每月 Credits','Monthly Plus Credits')}</span><strong>${state.credits.subscription}</strong><small>${state.subscription.nextAllocation?L(`下次发放 ${fmtDate(state.subscription.nextAllocation)}`,`Next allocation ${fmtDate(state.subscription.nextAllocation)}`):L('Plus 尚未开启','Plus is not active')}</small></div><div class="credit-type panel"><span>${L('赠送 Credits','Complimentary Credits')}</span><strong>${state.credits.promotional}</strong><small>${L(`有效至 ${fmtDate(PROMO_EXPIRY)}`,`Available until ${fmtDate(PROMO_EXPIRY)}`)}</small></div><div class="credit-type panel"><span>${L('购买的 Credits','Purchased Credits')}</span><strong>${state.credits.purchased}</strong><small>${L('不会随 Plus 取消而消失','Unaffected if Plus is cancelled')}</small></div></div>`}
function planCard(p){const annual=p.plan==='annual';return `<article class="plan-card ${annual?'featured':''}">${annual?`<span class="badge info">${L('更适合长期使用','Best for a longer view')}</span>`:''}<h3 style="margin-top:${annual?'14':'0'}px">RITUVIA Plus · ${L(p.zh,p.en)}</h3><div class="plan-price">${money(p.cents)} <small>/${annual?L('年','year'):L('月','month')}</small></div><p>${L('适合希望持续记录、定期回望，也偶尔需要更深入解读的人。','For people who want to keep a longer record, return to it over time, and occasionally go deeper.')}</p><ul class="check-list"><li>${L('每月 8 Credits','8 Credits each month')}</li><li>${L('完整阅读、日志与回望历史','Full reading, Journal, and Revisit history')}</li><li>${L('跨设备同步与更多圣所空间','Cross-device sync and more Sanctuary environments')}</li><li>${annual?L('按年续订；Credits 仍每月发放','Renews yearly; Credits are still added monthly'):L('按月续订','Renews monthly')}</li><li>${L('随时取消；当前周期结束后停止续订','Cancel anytime; renewal stops after the current period')}</li></ul><div class="plan-footer"><span class="hint">${L('Stripe 安全结账 · 适用税费会在结账时显示','Secure Stripe checkout · Applicable taxes appear at checkout')}</span><button class="primary-btn" onclick="beginCheckout('${p.code}')">${state.subscription.status==='active'?L('查看我的方案','View my plan'):L('选择此方案','Choose this plan')}</button></div></article>`}
function packCard(p){return `<article class="product-card"><span class="badge credit">${L('一次购买','One-time purchase')}</span><h3 style="margin-top:16px">${p.label}</h3><div class="credit-price">${money(p.cents)}</div><p>${L('购买的 Credits 会留在你的账户中，可使用 Stripe 或 USDC 付款。','Purchased Credits stay in your account. Pay with Stripe or USDC.')}</p><button class="ghost-btn" onclick="beginCheckout('${p.code}')">${L('选择','Choose')}</button></article>`}
function renderPlans(){return `<div class="page"><div class="shell">${crumbs([L('Plus 与 Credits','Plus & Credits')])}<div class="page-heading"><div><div class="eyebrow">${L('按自己的节奏','At your own pace')}</div><h1>${L('免费体验一直在。更深的内容，由你决定。','The free experience is always here. More depth is your choice.')}</h1></div><p>${L('使用 Credits 可以获得深度解读、收藏圣所物件或开始特别仪式。加入 Plus，则会每月获得 Credits，并把阅读、日志和回望长期保存在一起。','Use Credits for Deep Readings, Sanctuary collectibles, and special rituals. Join Plus for monthly Credits and a longer, connected history of readings, journaling, and revisits.')}</p></div>${state.user?creditSummary():`<div class="notice info"><span>✦</span><div><strong>${L('先体验，不必先登录','Explore before signing in')}</strong>${L('每日塔罗、基础塔罗、免费圣所、意图与日志都可以直接开始。需要保存 Credits、购买或跨设备同步时，再登录即可。','Daily Tarot, core Tarot, the free Sanctuary, intentions, and journaling can all begin without an account. Sign in only when you want to purchase, keep Credits, or sync across devices.')}</div></div>`}<section class="section"><div class="section-head"><div><div class="eyebrow">${L('免费体验','Included for everyone')}</div><h2>${L('不付费，也能走完整条路径','A complete path, with or without payment')}</h2></div><p>${L('从每日一张牌，到意图、免费仪式、日志和之后的回望，都可以完整使用。','From a daily card to intention, a free ritual, journaling, and a later revisit, the full path remains available.')}</p></div><div class="panel"><div class="grid-3"><div><span class="badge free">Free</span><h3>${L('每日与基础解读','Daily and core readings')}</h3><p>${L('每天一张牌，以及一张或三张塔罗的完整基础解读。','One daily card, plus complete core readings for one- or three-card Tarot.')}</p></div><div><span class="badge free">Free</span><h3>${L('圣所与日志','Sanctuary & Journal')}</h3><p>${L('免费烛光与香、一段可以自然结束的仪式，以及只属于你的文字。','A free candle and incense, a ritual with a clear ending, and writing that belongs to you.')}</p></div><div><span class="badge free">Free</span><h3>${L('回望','Revisit')}</h3><p>${L('把当时的意图和后来真正发生的事放在一起看。','Set your earlier intention beside what actually happened afterward.')}</p></div></div></div></section><section class="section alt"><div class="section-head"><div><div class="eyebrow">RITUVIA Plus</div><h2>${L('把阅读、记录和回望放在一起','Keep readings, notes, and returns together')}</h2></div><p>${L('每月获得 8 Credits，并保留更长的阅读、日志与回望历史。年度方案同样按月发放 Credits。','Receive 8 Credits each month and keep a longer history of readings, journaling, and revisits. The annual plan also allocates Credits monthly.')}</p></div><div class="grid-2">${PLUS_PLANS.map(planCard).join('')}</div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Credits</div><h2>${L('需要时再添一些','Add more only when you need them')}</h2></div><p>${L('Credits 可以用于深度解读、收藏物件和特别仪式。购买的 Credits 会保留在你的账户中，不受 Plus 取消影响。','Use Credits for Deep Readings, collectible objects, and special rituals. Purchased Credits stay with your account even if you cancel Plus.')}</p></div><div class="grid-3">${CREDIT_PACKS.map(packCard).join('')}</div><p class="hint" style="margin-top:16px">${L('Credits 与你的账户绑定，可用于 RITUVIA 内的指定体验。','Credits are tied to your account and can be used for selected RITUVIA experiences.')}</p></section><section class="section alt"><div class="section-head"><div><div class="eyebrow">${L('深度解读','Deep Readings')}</div><h2>${L('先看清内容，再决定是否继续','See what is included before you continue')}</h2></div></div><div class="grid-5">${DEEP_PRODUCTS.map(p=>`<article class="card"><span class="badge credit">${p.credits} Credit${p.credits===1?'':'s'}</span><h3 style="margin-top:14px">${L(p.zh,p.en)}</h3><p>${L(p.descZh,p.descEn)}</p><a class="ghost-btn" href="#deep" onclick="selectDeep('${p.code}')">${L('了解详情','See details')}</a></article>`).join('')}</div></section><section class="section"><div class="section-head"><div><div class="eyebrow">${L('圣所收藏','Sanctuary collection')}</div><h2>${L('有些会一直留下，有些只陪你一次','Some stay with you; some are made for one occasion')}</h2></div><p>${L('收藏物件解锁后会一直保留；特别仪式每次解锁，使用一次。','Collectible objects stay in your account once unlocked. Special rituals are available for one use each time.')}</p></div><h3>${L('永久收藏','Permanent collection')}</h3><div class="grid-4">${OBJECTS.filter(x=>x.type==='permanent').map(i=>`<article class="product-card"><div class="method-icon">${i.icon}</div><span class="badge credit">${i.credits} Credits · ${L('永久','Permanent')}</span><h3 style="margin-top:14px">${L(i.zh,i.en)}</h3><p>${L(i.descZh,i.descEn)}</p><button class="ghost-btn" onclick="showRitualItem('${i.code}')">${L('看看详情','See details')}</button></article>`).join('')}</div><h3 style="margin-top:34px">${L('特别仪式','Special rituals')}</h3><div class="grid-5">${SPECIAL_RITUALS.map(i=>`<article class="product-card"><div class="method-icon">${i.icon}</div><span class="badge credit">${i.credits} Credits · ${L('一次','One use')}</span><h3 style="margin-top:14px">${L(i.zh,i.en)}</h3><p>${L(i.descZh,i.descEn)}</p><button class="ghost-btn" onclick="showRitualItem('${i.code}')">${L('看看详情','See details')}</button></article>`).join('')}</div></section><section class="section alt"><div class="section-head"><div><div class="eyebrow">${L('付款方式','Payment options')}</div><h2>${L('使用熟悉的方式完成付款','Pay in the way that feels familiar')}</h2></div><p>${L('Plus 订阅通过 Stripe 管理。一次性 Credits 可以使用 Stripe，也可以用 USDC 在 Base 网络付款。','Plus subscriptions are managed through Stripe. One-time Credits can be purchased through Stripe or with USDC on Base.')}</p></div><div class="grid-2"><article class="card"><span class="badge info">Stripe</span><h3 style="margin-top:14px">${L('银行卡与数字钱包','Cards and digital wallets')}</h3><p>${L('支持常见银行卡、Apple Pay、Google Pay 和 Link。订阅付款方式可以在账户中管理。','Supports major cards, Apple Pay, Google Pay, and Link. Subscription payment methods can be managed from your account.')}</p></article><article class="card"><span class="badge credit">USDC · Base</span><h3 style="margin-top:14px">${L('加密货币付款','Crypto payment')}</h3><p>${L('使用常见钱包购买一次性 Credits。付款钱包不会在未经确认时自动成为登录方式。','Use a common wallet to buy one-time Credits. A payment wallet is never made a sign-in method without your confirmation.')}</p></article></div></section><section class="section alt"><div class="panel"><h2>${L('购买与账户支持','Purchases & account support')}</h2><p>${L('登录后可以查看订单、订阅、退款记录、Credits 活动和你的圣所收藏。','Sign in to review orders, subscription details, refunds, Credit activity, and your Sanctuary collection.')}</p><div class="button-row"><a class="primary-btn" href="#orders">${L('查看订单','View orders')}</a><a class="ghost-btn" href="#privacy">${L('管理隐私与数据','Manage privacy & data')}</a></div></div></section></div></div>`}

function sendSignInLink(){const email=document.getElementById('authEmail')?.value.trim()||'';if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast(L('请输入有效邮箱地址。','Enter a valid email address.'));return}state.auth.email=email;state.auth.sent=true;saveState();renderApp()}
function completeSignIn(email=state.auth.email||'reviewer@example.test'){const after=state.auth.after;state.user={id:'user_'+hashText(email),email,authMethod:'email',createdAt:new Date().toISOString()};state.auth={email,sent:false,after:null};saveState();toast(L('已经登录；匿名体验保留在这个账户中。','You are signed in; your anonymous work remains with this account.'));continueAfterSignIn(after)}
function signOut(){state.user=null;state.auth={...cloneDefault().auth};saveState();go('home');toast(L('你已经退出。','You are signed out.'))}
function renderSignIn(){if(state.user)return `<div class="page"><div class="shell"><div class="panel empty"><h1>${L('你已经登录','You are signed in')}</h1><p>${esc(accountIdentity())}</p><div class="button-row" style="justify-content:center"><a class="primary-btn" href="#account">${L('进入我的空间','Open my space')}</a><a class="ghost-btn" href="#billing">${L('登录与付款方式','Sign-in & payments')}</a></div></div></div></div>`;return `<div class="page page-tight"><div class="shell"><div class="auth-card"><aside class="auth-art"><div><div class="eyebrow">${L('先体验，再决定要不要留下','Experience first. Sign in when you want to keep it.')}</div><h2>${L('把已经开始的部分，<br>留在自己的空间里。','Keep what you have begun<br>in one private place.')}</h2><p>${L('邮箱、通行密钥和钱包都可以成为你的登录方式。登录后，解读、意图、Credits、订单和收藏会放在同一个账户里。','Email, passkeys, and wallets can all be sign-in methods. Your readings, intentions, Credits, orders, and collection stay together after sign-in.')}</p></div><div class="notice"><span>⌁</span><div>${L('使用钱包登录只会请求一条签名，不会移动资金，也不会批准付款。','Wallet sign-in requests a message signature only. It never moves funds or approves a payment.')}</div></div></aside><section class="auth-form">${state.auth.sent?`<div class="method-icon">✉</div><h1>${L('去邮箱看看','Check your inbox')}</h1><p>${L(`我们已经为 ${esc(state.auth.email)} 准备好登录链接。`,`Your sign-in link is ready for ${esc(state.auth.email)}.`)}</p><div class="notice"><span>⌁</span><div>${L('登录链接仅可使用一次，并会在短时间后失效。','The link can be used once and expires after a short time.')}</div></div><button class="primary-btn" onclick="completeSignIn(state.auth.email)">${L('继续进入 RITUVIA','Continue to RITUVIA')}</button><button class="ghost-btn" onclick="state.auth.sent=false;saveState();renderApp()">${L('换一个邮箱','Use a different email')}</button>`:`<div class="eyebrow">RITUVIA</div><h1>${L('登录，留下你已经开始的部分','Sign in to keep what you have begun')}</h1><p>${L('无需密码。使用邮箱链接、通行密钥，或直接用钱包签名登录。','No password needed. Use an email link, a passkey, or sign in directly with your wallet.')}</p><div class="field"><label for="authEmail">${L('邮箱','Email')}</label><input id="authEmail" type="email" autocomplete="email" value="${esc(state.auth.email)}" placeholder="you@example.com"></div><button class="primary-btn" style="width:100%" onclick="sendSignInLink()">${L('发送登录链接','Send me a sign-in link')}</button><div class="divider">${L('或','or')}</div><button class="provider-btn" onclick="showWalletPicker('sign_in')"><span aria-hidden="true">◈</span>${L('使用钱包继续','Continue with a wallet')}</button><button class="provider-btn" onclick="completeSignIn('google@example.com')">G&nbsp; ${L('使用 Google 继续','Continue with Google')}</button><button class="provider-btn" onclick="completeSignIn('apple@example.com')">● ${L('使用 Apple 继续','Continue with Apple')}</button><button class="provider-btn" onclick="completeSignIn('passkey@example.com')">⌁ ${L('使用通行密钥继续','Continue with a passkey')}</button><p class="hint">${L('继续即表示你确认自己已满 18 岁，并同意服务条款与隐私政策。','By continuing, you confirm you are 18 or older and agree to the Terms and Privacy Policy.')}</p>`}</section></div></div></div>`}

function creditActivityProductLabel(code){const d=deepProduct(code);if(d)return L(d.zh,d.en);const r=ritualItem(code);if(r)return L(r.zh,r.en);const p=checkoutProduct(code);if(p)return L(p.zh,p.en);return L('Credits 活动','Credit activity')}
function ledgerReason(row){const product=creditActivityProductLabel(row.productCode);const map={welcome_credit:[L('欢迎 Credits','Welcome Credits'),L('送给新账户的一份体验额度','A welcome amount for your account')],credit_pack_purchase:[L('Credits 已加入','Credits added'),product],subscription_monthly_allocation:[L('Plus 月度 Credits','Plus monthly Credits'),L('本订阅月可用','Available for this subscription month')],credit_reserved:[L('已用于','Used for'),product],credit_reservation:[L('已用于','Used for'),product],credit_consumption_finalized:[L('已完成','Completed'),product],generation_failed_auto_return:[L('已退回','Returned'),product],refund_reversal:[L('退款调整','Refund adjustment'),product]};return map[row.reason]||[L('Credits 活动','Credit activity'),product]}
function renderLedger(limit=12){const rows=state.credits.ledger.filter(r=>r.reason!=='credit_consumption_finalized').slice(0,limit);if(!rows.length)return `<div class="empty"><p>${L('还没有 Credits 活动。','No Credit activity yet.')}</p></div>`;return `<div class="ledger">${rows.map(r=>{const label=ledgerReason(r),amount=Number(r.amount)||0;return `<div class="ledger-row"><div><strong>${label[0]}</strong><small>${label[1]||''}${r.expiry?` · ${L('到期','Expires')} ${fmtDate(r.expiry)}`:''}</small></div><span class="ledger-amount ${amount>=0?'in':'out'}">${amount>0?'+':''}${amount}</span><time class="hint">${fmtDate(r.createdAt,true)}</time></div>`}).join('')}</div>`}
function subscriptionStatusText(){const s=state.subscription.status;return ({none:L('未订阅','No subscription'),active:L('有效','Active'),past_due:L('付款逾期','Past due'),grace_period:L('宽限期','Grace period'),paused:L('已暂停','Paused'),cancel_at_period_end:L('周期结束时取消','Cancels at period end'),cancelled:L('已取消','Cancelled'),expired:L('已到期','Expired'),refunded:L('已退款','Refunded')})[s]||s}
function cancelSubscription(){if(state.subscription.status!=='active')return;if(!confirm(L('在当前周期结束时取消 Plus 吗？购买的 Credits 不受影响。','Cancel Plus at the end of the current period? Purchased Credits will remain.')))return;state.subscription.status='cancel_at_period_end';state.subscription.cancelAt=state.subscription.nextAllocation;saveState();renderApp();toast(L('Plus 将在当前周期结束时取消。','Plus will cancel at the end of the current period.'))}

function renderBilling(){if(!state.user)return accountGate('登录后管理登录与付款方式','Sign in to manage sign-in and payments','在这里连接钱包、保存付款方式并管理订阅。','Connect wallets, save payment methods, and manage your subscription here.');const identity=accountIdentity();return `<div class="page"><div class="shell">${crumbs([L('账户','Account'),L('登录与付款方式','Sign-in & payments')])}<div class="page-heading"><div><div class="eyebrow">${L('账户安全与结账','Account access & checkout')}</div><h1>${L('登录与付款方式','Sign-in and payment methods')}</h1></div><p>${L('你可以使用邮箱、通行密钥或钱包登录。银行卡由 Stripe 保存，加密付款钱包则只在你选择时连接。','Sign in with email, passkey, or wallet. Cards are stored by Stripe, while crypto payment wallets connect only when you choose them.')}</p></div><div class="grid-2"><section class="panel"><span class="badge info">${L('登录方式','Sign-in methods')}</span><h2 style="font-size:36px;margin-top:14px">${esc(identity)}</h2><p>${state.user.authMethod==='wallet'?L('当前使用钱包签名登录。','You currently sign in with a wallet.'):L('当前使用邮箱或通行密钥登录。','You currently sign in with email or passkey.')}</p>${state.wallet.linked.length?state.wallet.linked.map(w=>`<div class="wallet-row"><div><strong>${walletProvider(w.provider).name}</strong><small class="wallet-address">${w.address}</small></div><button class="ghost-btn" onclick="unlinkWallet('${w.address}')">${L('移除','Remove')}</button></div>`).join(''):`<div class="empty" style="padding:24px"><p>${L('还没有连接钱包。','No wallet linked yet.')}</p></div>`}<button class="soft-btn" style="margin-top:14px" onclick="showWalletPicker('link')">${L('连接钱包','Connect a wallet')}</button></section><section class="panel"><span class="badge info">Stripe</span><h2 style="font-size:36px;margin-top:14px">${L('银行卡与数字钱包','Cards & digital wallets')}</h2><p>${L('付款信息由 Stripe 安全保存。RITUVIA 不会收到完整卡号。','Payment details are securely stored by Stripe. RITUVIA never receives the full card number.')}</p>${state.payments.savedMethods.length?state.payments.savedMethods.map(pm=>`<div class="billing-row saved-method"><span class="method-icon-small">${pm.kind==='card'?'VISA':pm.label.slice(0,2).toUpperCase()}</span><div><strong>${pm.label}</strong><small>${pm.detail}</small></div><button class="ghost-btn" onclick="removePaymentMethod('${pm.id}')">${L('移除','Remove')}</button></div>`).join(''):`<div class="empty" style="padding:24px"><p>${L('还没有保存付款方式。','No saved payment methods yet.')}</p></div>`}<button class="primary-btn" style="margin-top:14px" onclick="showAddPaymentMethod()">${L('添加付款方式','Add payment method')}</button></section><section class="panel"><span class="badge credit">USDC</span><h2 style="font-size:36px;margin-top:14px">${L('加密付款','Crypto payments')}</h2><p>${L('一次性 Credits 可以使用 USDC 在 Base 网络付款。付款地址与交易记录会出现在对应订单中。','One-time Credits can be purchased with USDC on Base. The payment address and transaction record appear with the order.')}</p>${state.payments.cryptoWallet?`<div class="wallet-row"><div><strong>${L('最近使用的钱包','Recently used wallet')}</strong><small class="wallet-address">${state.payments.cryptoWallet}</small></div><button class="ghost-btn" onclick="showWalletPicker('checkout')">${L('更换','Change')}</button></div>`:`<button class="soft-btn" onclick="showWalletPicker('checkout')">${L('连接付款钱包','Connect payment wallet')}</button>`}</section><section class="panel"><span class="badge ${state.subscription.status==='active'?'ok':'info'}">RITUVIA Plus</span><h2 style="font-size:36px;margin-top:14px">${subscriptionStatusText()}</h2><p>${state.subscription.status==='none'?L('Plus 尚未开启。','Plus is not active yet.'):L(`下次 Credits 发放：${fmtDate(state.subscription.nextAllocation)}。`,`Next Credit allocation: ${fmtDate(state.subscription.nextAllocation)}.`)}</p><div class="button-row">${state.subscription.status==='active'?`<button class="ghost-btn" onclick="cancelSubscription()">${L('在周期结束时取消','Cancel at period end')}</button>`:`<a class="primary-btn" href="#plans">${L('查看 Plus','Explore Plus')}</a>`}<a class="ghost-btn" href="#orders">${L('查看账单与订单','View billing & orders')}</a></div></section></div></div></div>`}

function accountGate(titleZh,titleEn,bodyZh,bodyEn){return `<div class="page"><div class="shell"><div class="panel empty"><h1>${L(titleZh,titleEn)}</h1><p>${L(bodyZh,bodyEn)}</p><a class="primary-btn" href="#sign-in">${L('去登录','Sign in')}</a></div></div></div>`}
function renderAccount(){if(!state.user)return accountGate('登录后进入你的私人空间','Sign in to enter your private space','不登录也可以完成免费解读、意图、仪式、日志和回望。登录后，可以把 Credits、订单和跨设备历史放在一起。','You can complete free readings, intentions, rituals, journaling, and revisits without signing in. An account keeps Credits, orders, and cross-device history together.');const premiumRituals=state.orders.filter(o=>o.kind==='ritual_completion'&&SPECIAL_RITUALS.some(r=>r.code===o.productCode));return `<div class="page"><div class="shell">${crumbs([L('账户','Account')])}<div class="page-heading"><div><div class="eyebrow">${L('你选择留下的，都在这里','Everything you chose to keep')}</div><h1>${L('欢迎回来','Welcome back')}</h1></div><p>${L('继续上次停下的地方，或者只是看看这段时间里，你已经写下、完成和带走了什么。','Continue where you left off, or simply see what you have written, completed, and carried forward over time.')}</p></div><div class="account-grid"><aside class="panel account-sidebar"><div class="account-nav"><a class="active" href="#account">${L('概览','Overview')}</a><a href="#readings">${L('解读','Readings')}</a><a href="#sanctuary">${L('圣所','Sanctuary')}</a><a href="#journal">${L('日志','Journal')}</a><a href="#revisit">${L('回望','Revisit')}</a><a href="#orders">${L('订单与退款','Orders & refunds')}</a><a href="#billing">${L('登录与付款方式','Sign-in & payments')}</a><a href="#privacy">${L('隐私与数据','Privacy & data')}</a></div><div class="notice" style="margin-top:18px"><span>◉</span><div><strong>${esc(accountIdentity())}</strong>${L('当前账户','Current account')}</div></div><button class="ghost-btn" style="margin-top:18px;width:100%" onclick="signOut()">${L('退出','Sign out')}</button></aside><section><div class="stats"><div class="stat-card"><small>${L('可用 Credits','Available Credits')}</small><div class="value">${creditTotal()}</div></div><div class="stat-card"><small>${L('深度解读','Deep Readings')}</small><div class="value">${state.deep.history.length}</div></div><div class="stat-card"><small>${L('收藏物件','Collected objects')}</small><div class="value">${state.ownedObjects.length-2}</div></div><div class="stat-card"><small>${L('等待回望','Returns waiting')}</small><div class="value">${state.revisits.filter(x=>x.status==='scheduled').length}</div></div></div><div class="panel" style="margin-top:18px"><div style="display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap"><div><span class="badge ${state.subscription.status==='active'?'ok':'info'}">${subscriptionStatusText()}</span><h2 style="font-size:38px;margin-top:12px">RITUVIA Plus</h2><p>${state.subscription.status==='none'?L('Plus 尚未开启。你仍然可以继续使用全部免费体验。','Plus is not active. All free experiences remain available.'):L(`当前为${state.subscription.plan==='annual'?'年度':'月度'}方案。下次 Credits 发放：${fmtDate(state.subscription.nextAllocation)}。`,`You are on the ${state.subscription.plan} plan. Next Credit allocation: ${fmtDate(state.subscription.nextAllocation)}.`)}</p></div>${state.subscription.status==='active'?`<button class="ghost-btn" onclick="cancelSubscription()">${L('在周期结束时取消','Cancel at period end')}</button>`:`<a class="primary-btn" href="#plans">${L('了解 Plus','Explore Plus')}</a>`}</div><p class="hint" style="margin-top:16px">${L('取消 Plus 后，当前周期仍可使用；已经购买的 Credits 会继续保留。','After cancellation, access continues through the current period, and purchased Credits remain in your account.')}</p></div><div style="margin-top:18px">${creditSummary()}</div><div class="panel" style="margin-top:18px"><h2 style="font-size:36px">${L('最近 Credits 活动','Recent Credit activity')}</h2>${renderLedger(8)}</div><div class="grid-2" style="margin-top:18px"><div class="panel"><h3>${L('永久收藏','Permanent collection')}</h3>${state.ownedObjects.filter(c=>!c.startsWith('free_')).length?state.ownedObjects.filter(c=>!c.startsWith('free_')).map(c=>{const i=ritualItem(c);return `<div class="timeline-item"><span>${i.icon} ${L(i.zh,i.en)}</span><a href="#sanctuary" onclick="selectRitualItem('${i.code}')">${L('使用','Use')}</a></div>`}).join(''):`<p>${L('收藏还是空的。免费烛光与香随时可以使用。','Your collection is still empty. The free candle and incense are always available.')}</p>`}</div><div class="panel"><h3>${L('特别仪式','Special rituals')}</h3>${SPECIAL_RITUALS.filter(i=>(state.ritualPasses[i.code]||0)>0).length?SPECIAL_RITUALS.filter(i=>(state.ritualPasses[i.code]||0)>0).map(i=>`<div class="timeline-item"><span>${L(i.zh,i.en)}</span><strong>${state.ritualPasses[i.code]} ${L('次可用','available')}</strong></div>`).join(''):`<p>${premiumRituals.length?L('已经完成的特别仪式可以在订单与活动里查看。','Completed special rituals appear in Orders and activity.'):L('还没有特别仪式。','No special rituals yet.')}</p>`}</div></div><div class="panel" style="margin-top:18px"><h3>${L('深度解读','Deep Readings')}</h3>${state.deep.history.length?state.deep.history.slice(0,4).map(r=>{const p=deepProduct(r.code);return `<div class="timeline-item"><div><strong>${L(p.zh,p.en)}</strong><small>${fmtDate(r.createdAt,true)} · ${L('AI 辅助','AI-assisted')}</small></div><a href="#deep">${L('查看','View')}</a></div>`}).join(''):`<p>${L('还没有深度解读。想开始时，可以从解读页面选择。','No Deep Readings yet. Choose one from Readings whenever it feels useful.')}</p>`}</div></section></div></div></div>`}

function requestRefund(id){const o=state.orders.find(x=>x.id===id);if(!o||o.status!=='paid')return;if(o.kind==='credit_pack'){const p=checkoutProduct(o.productCode);if(state.credits.purchased<p.credits){toast(L('部分 Credits 已经使用，无法自动完成全额退款。','Some Credits have already been used, so a full refund cannot be completed automatically.'));return}if(!confirm(L('退款并撤销这笔订单中尚未使用的 Credits 吗？','Refund and reverse the unused Credits from this order?')))return;state.credits.purchased-=p.credits;appendLedger({type:'refund_adjustment',amount:-p.credits,reason:'refund_reversal',productCode:o.productCode,orderId:o.id,reversalRef:o.id,status:'reversal'});o.status='refunded';o.refundedAt=new Date().toISOString();saveState();renderApp();toast(L('退款已经完成，未使用的 Credits 已从账户中移除。','Refund complete. Unused Credits have been removed from your account.'));return}toast(L('订阅退款会根据购买地区和适用政策由支持团队审核。','Subscription refunds are reviewed by support according to your purchase region and applicable policy.'))}
function renderOrders(){if(!state.user)return accountGate('登录后查看订单与退款','Sign in to view orders and refunds','订单、收据、Credits 和退款记录会保存在你的账户里。','Orders, receipts, Credits, and refund records are kept with your account.');const commerce=state.orders.filter(o=>['credit_pack','plus'].includes(o.kind));return `<div class="page"><div class="shell">${crumbs([L('账户','Account'),L('订单与退款','Orders & refunds')])}<div class="page-heading"><div><div class="eyebrow">${L('购买与退款记录','Purchases & refunds')}</div><h1>${L('订单','Orders')}</h1></div><p>${L('在这里查看购买时间、金额、当前状态和退款入口。','Review purchase dates, amounts, current status, and refund options here.')}</p></div>${commerce.length?`<div class="panel">${commerce.map(o=>`<div class="order-row"><div><strong>${L(o.titleZh,o.titleEn)}</strong><small class="hint" style="display:block">${fmtDate(o.createdAt,true)} · ${paymentMethodLabel(o)} · ${esc(o.id)}</small></div><div style="text-align:right"><div class="order-state"><span class="badge ${o.status==='paid'?'ok':o.status==='refunded'?'warn':'info'}">${o.status}</span><strong>${money(o.cents)}</strong></div>${o.status==='paid'?`<button class="ghost-btn" style="margin-top:8px" onclick="requestRefund('${o.id}')">${L('申请退款','Request refund')}</button>`:''}</div></div>`).join('')}</div>`:`<div class="empty"><h2>${L('还没有订单','No orders yet')}</h2><p>${L('当你购买 Plus 或 Credits 后，记录会出现在这里。','Purchases for Plus or Credits will appear here.')}</p><a class="primary-btn" href="#plans">${L('查看 Plus 与 Credits','See Plus & Credits')}</a></div>`}<div class="panel" style="margin-top:18px"><h2 style="font-size:36px">${L('Credits 活动','Credit activity')}</h2>${renderLedger(20)}</div></div></div>`}

function saveJournal(){const text=document.getElementById('journalText')?.value.trim()||'';if(!text){toast(L('先写一点你想留给未来自己的话。','Write a few words you would like your future self to keep.'));return}const a=activeIntention();state.journal.unshift({id:uid('journal'),text,intentionId:a?.id||null,createdAt:new Date().toISOString()});saveState();renderApp();toast(L('这段文字已经保存。','Your note is saved.'))}
function deleteJournal(id){if(!confirm(L('删除这段文字吗？','Delete this note?')))return;state.journal=state.journal.filter(x=>x.id!==id);saveState();renderApp()}
function renderJournal(){const a=activeIntention();return `<div class="page"><div class="shell">${crumbs([L('日志','Journal')])}<div class="page-heading"><div><div class="eyebrow">${L('只属于你 · 随时带走或删除','Yours alone · Take it with you or delete it anytime')}</div><h1>${L('把后来发生的事，留在这里','A place for what happened next')}</h1></div><p>${L('写下你真正做了什么、感受如何，也可以记下哪些解释并不适合你。没有评分、连续打卡或每天都要写的压力。','Write what you actually did, how it felt, and what did not fit. There are no scores, streaks, or pressure to write every day.')}</p></div><div class="grid-2"><section class="panel"><span class="badge free">${L('只属于你的空间','A private space of your own')}</span><h2 style="font-size:40px;margin-top:14px">${L('这一刻，什么值得被记住？','What feels worth remembering?')}</h2>${a?`<div class="notice info"><span>✦</span><div><strong>${L('从这份意图开始','From this intention')}</strong>${esc(a.text)}<br><small>${esc(a.action||'')}</small></div></div>`:''}<div class="field"><label for="journalText">${L('写一点','Your note')}</label><textarea id="journalText" maxlength="3000" placeholder="${L('后来发生了什么？我做了什么？现在回头看，哪里不一样了？','What happened next? What did I do? Looking back, what feels different now?')}"></textarea><span class="hint">${L('你的私密文字不会自动用于广告、分析或 AI 个性化。','Your private writing is never used automatically for advertising, analytics, or AI personalization.')}</span></div><button class="primary-btn" onclick="saveJournal()">${L('保存这段文字','Keep this note')}</button></section><section class="panel"><h2 style="font-size:36px">${L('写过的片段','Your recent notes')}</h2>${state.journal.length?`<div class="timeline">${state.journal.map(j=>`<article class="timeline-item"><div><p style="margin:0;color:var(--ink)">${esc(j.text)}</p><small>${fmtDate(j.createdAt,true)}</small></div><button class="ghost-btn" onclick="deleteJournal('${j.id}')">${L('删除','Delete')}</button></article>`).join('')}</div>`:`<div class="empty"><p>${L('这里还空着。仪式结束后，或任何你想记下来的时候，都可以写第一段。','This space is still empty. Write after a ritual—or whenever something feels worth keeping.')}</p></div>`}</section></div></div></div>`}

function scheduleRevisit(){const a=activeIntention(),date=document.getElementById('revisitDate')?.value||a?.revisitDate||'';if(!a){toast(L('先写一份意图，或从已有意图里选一份。','Write an intention first, or choose one you already have.'));return}if(!date){toast(L('请选择一个想回来看的日子。','Choose a day you would like to return.'));return}const existing=state.revisits.find(r=>r.intentionId===a.id&&r.status==='scheduled');if(existing){existing.date=date}else state.revisits.unshift({id:uid('revisit'),intentionId:a.id,date,status:'scheduled',createdAt:new Date().toISOString(),reflection:''});a.revisitDate=date;saveState();renderApp();toast(L('已经记下这个日子。','Your return date is saved.'))}
function completeRevisit(id){const r=state.revisits.find(x=>x.id===id),text=document.getElementById(`revisit_${id}`)?.value.trim()||'';if(!r||!text){toast(L('先写下真实发生的事。','Write what actually happened first.'));return}r.reflection=text;r.status='completed';r.completedAt=new Date().toISOString();saveState();renderApp();toast(L('这次回望已经保存。','Your reflection has been saved.'))}
function archiveRevisit(id){const r=state.revisits.find(x=>x.id===id);if(!r)return;r.status='archived';saveState();renderApp()}
function renderRevisit(){const a=activeIntention(),scheduled=state.revisits.filter(x=>x.status==='scheduled'),completed=state.revisits.filter(x=>x.status==='completed');return `<div class="page"><div class="shell">${crumbs([L('回望','Revisit')])}<div class="page-heading"><div><div class="eyebrow">${L('让时间说话','Let time speak')}</div><h1>${L('回来看看，什么已经改变','Return and see what has changed')}</h1></div><p>${L('把当时写下的意图，与真正发生的事放在一起。这里不验证预言，只帮助你看见行动、变化与新的理解。','Set your earlier intention beside what actually happened. This does not prove a prediction; it helps you notice action, change, and new understanding.')}</p></div><div class="grid-2"><section class="panel"><h2 style="font-size:38px">${L('约定一个回来看的日子','Choose a day to return')}</h2>${a?`<div class="notice info"><span>✦</span><div><strong>${esc(a.text)}</strong>${esc(a.action||'')}</div></div><div class="field"><label for="revisitDate">${L('回来日期','Return date')}</label><input id="revisitDate" type="date" value="${esc(a.revisitDate||'')}"></div><button class="primary-btn" onclick="scheduleRevisit()">${L('记下这个日子','Save this date')}</button>`:`<div class="empty"><p>${L('还没有选中的意图。先去圣所写下一份。','No intention is selected yet. Begin one in the sanctuary.')}</p><a class="primary-btn" href="#sanctuary">${L('去写一份意图','Write an intention')}</a></div>`}</section><section class="panel"><h2 style="font-size:38px">${L('等你回来的内容','Waiting for you')}</h2>${scheduled.length?scheduled.map(r=>{const i=state.intentions.find(x=>x.id===r.intentionId);return `<article class="card" style="margin-bottom:12px"><span class="badge warn">${fmtDate(r.date)}</span><h3 style="margin-top:14px">${esc(i?.text||L('一份意图','An intention'))}</h3><p>${esc(i?.action||'')}</p><div class="field"><label for="revisit_${r.id}">${L('后来，真实生活里发生了什么？','What happened in real life?')}</label><textarea id="revisit_${r.id}" placeholder="${L('我做了……；事情变成了……；如果再来一次，我会……','I did…; what followed was…; next time I would…')}"></textarea></div><div class="button-row"><button class="primary-btn" onclick="completeRevisit('${r.id}')">${L('完成这次回望','Complete this return')}</button><button class="ghost-btn" onclick="archiveRevisit('${r.id}')">${L('暂时收起','Set aside')}</button></div></article>`}).join(''):`<div class="empty"><p>${L('还没有约定回来的日子。','No return dates yet.')}</p></div>`}</section></div><section class="panel" style="margin-top:18px"><h2 style="font-size:36px">${L('已经回望过','Completed returns')}</h2>${completed.length?completed.map(r=>{const i=state.intentions.find(x=>x.id===r.intentionId);return `<div class="timeline-item"><div><strong>${esc(i?.text||'')}</strong><p>${esc(r.reflection)}</p><small>${fmtDate(r.completedAt,true)}</small></div></div>`}).join(''):`<p>${L('完成后，你的回望会留在这里。','Completed returns will live here.')}</p>`}</section></div></div>`}

function togglePrivacy(key){state.privacy[key]=!state.privacy[key];saveState();renderApp()}
function deletePrivateContent(){if(!confirm(L('删除所有解读、意图、仪式、日志、回望与出生资料吗？订单记录会保留。','Delete all readings, intentions, rituals, journals, revisits, and birth details? Order records will remain.')))return;state.daily=cloneDefault().daily;state.tarot=cloneDefault().tarot;state.deep=cloneDefault().deep;state.numerology=cloneDefault().numerology;state.astrology=cloneDefault().astrology;state.intentions=[];state.activeIntentionId=null;state.ritual={...cloneDefault().ritual,selected:'free_candle'};state.journal=[];state.revisits=[];saveState();renderApp();toast(L('私密内容已从当前浏览器删除。','Private content has been deleted from this browser.'))}
function deleteAccount(){if(!confirm(L('删除这个账户和当前浏览器中的全部数据吗？此操作无法撤销。','Delete this account and all data in this browser? This cannot be undone.')))return;STORAGE.removeItem(STORAGE_KEY);state=cloneDefault();go('home');renderApp()}
function renderPrivacy(){return `<div class="page"><div class="shell">${crumbs([L('隐私与数据','Privacy & data')])}<div class="page-heading"><div><div class="eyebrow">${L('决定权在你','You are in control')}</div><h1>${L('你的数据，由你保留、带走或删除','Your data, yours to keep, take, or delete')}</h1></div><p>${L('在这里管理数据下载、个性化选择、当前会话和删除操作。','Manage data downloads, personalization choices, your current session, and deletion controls here.')}</p></div><div class="grid-2"><section class="panel"><h2 style="font-size:36px">${L('下载一份副本','Download a copy')}</h2><p>${L('包含你的账户、解读、意图、仪式、日志、回望、Credits 活动、订单与设置。','Includes your account, readings, intentions, rituals, journaling, revisits, Credit activity, orders, and settings.')}</p><button class="primary-btn" onclick="downloadData()">${L('下载我的数据','Download my data')}</button></section><section class="panel"><h2 style="font-size:36px">${L('个性化选择','Personalization choices')}</h2><label class="timeline-item"><span>${L('使用不含私密原文的行为数据改进体验','Use behavioral data without private text to improve the experience')}</span><input type="checkbox" ${state.privacy.analytics?'checked':''} onchange="togglePrivacy('analytics')"></label><label class="timeline-item"><span>${L('允许个性化总结；默认不读取私密日志','Allow personalized summaries; private journal entries are excluded by default')}</span><input type="checkbox" ${state.privacy.personalization?'checked':''} onchange="togglePrivacy('personalization')"></label><p class="hint">${L('服务通知、营销、分析、个性化和敏感内容使用会分别征得同意。','Service notices, marketing, analytics, personalization, and sensitive-content use are handled through separate choices.')}</p></section><section class="panel"><h2 style="font-size:36px">${L('当前会话','Current session')}</h2><p>${state.user?`${esc(accountIdentity())} · ${L('已登录','Signed in')}`:L('当前没有登录会话。','There is no signed-in session.')}</p>${state.user?`<button class="ghost-btn" onclick="signOut()">${L('退出这台设备','Sign out on this device')}</button>`:''}</section><section class="panel"><h2 style="font-size:36px">${L('删除与离开','Delete & leave')}</h2><p>${L('删除私密内容不会影响必要的订单记录。删除账户前，你仍然可以先下载一份数据副本。','Deleting private content does not affect required order records. You can download a copy of your data before deleting your account.')}</p><div class="button-row"><button class="danger-btn" onclick="deletePrivateContent()">${L('删除全部私密内容','Delete all private content')}</button>${state.user?`<button class="danger-btn" onclick="deleteAccount()">${L('删除账户和数据','Delete account and data')}</button>`:''}</div></section></div></div></div>`}

function renderTrust(){return `<div class="page"><div class="shell">${crumbs([L('关于 RITUVIA','About RITUVIA')])}<div class="page-heading"><div><div class="eyebrow">${L('安静、私密，也保留你的判断','Quiet, private, and always yours to interpret')}</div><h1>${L('RITUVIA 提供角度，不替你下结论','RITUVIA offers perspective, not verdicts')}</h1></div><p>${L('这里有塔罗、数字命理、西方占星、个人仪式和私密日志。它们可以帮你换一个角度看事情，但真正的意义和决定始终属于你。','RITUVIA brings together Tarot, numerology, Western astrology, personal ritual, and private journaling. They can help you see something differently, but the meaning and decision remain yours.')}</p></div><div class="grid-3"><article class="card"><span class="badge free">${L('从完整体验开始','Begin with a complete experience')}</span><h3>${L('基础解读不会被藏起来','Core readings are never hidden')}</h3><p>${L('每日塔罗和基础塔罗会完整显示牌面、方向、主题、问题和现实中的一小步。','Daily Tarot and core Tarot show the cards, orientations, themes, questions, and a grounded next step in full.')}</p></article><article class="card"><span class="badge info">AI</span><h3>${L('AI 只负责整理，不负责决定','AI helps organize; it does not decide')}</h3><p>${L('深度解读只在需要个性化语境时调用 AI。每日塔罗、抽牌、数字计算和星体位置仍由确定性系统完成，AI 不能改写这些事实。','AI is used only when a reading needs personalized context. Daily Tarot, card draws, numerology, and astronomical placements remain deterministic, and AI cannot rewrite those facts.')}</p></article><article class="card"><span class="badge credit">Credits</span><h3>${L('付费改变深度与氛围，不改变结果','Payment changes depth and atmosphere, not outcomes')}</h3><p>${L('Credits 可以增加个性化、内容深度、视觉、声音和收藏，但不会购买好运、灵验或确定未来。','Credits can add personalization, depth, art, sound, and collection value—but never luck, spiritual efficacy, or certainty about the future.')}</p></article></div><section class="section"><div class="grid-2"><div class="panel"><h2 style="font-size:38px">${L('你可以不同意','You are free to disagree')}</h2><p>${L('任何解读都只是一种可能的理解。留下对你有用的部分，不合适的可以放下。','Every reading is one possible interpretation. Keep what is useful and leave what does not fit.')}</p><ul class="check-list"><li>${L('牌面不能证明未来会发生什么','Cards cannot establish what will happen')}</li><li>${L('关系解读不会替另一个人说出内心','Relationship readings do not speak for another person')}</li><li>${L('年度内容提供主题和回看，不是事件预测','Yearly readings offer themes and returns, not event forecasts')}</li><li>${L('免费蜡烛与香始终完整可用','The free candle and incense always stand on their own')}</li></ul></div><div class="panel"><h2 style="font-size:38px">${L('有些问题需要真实的人类支持','Some questions need real human support')}</h2><p>${L('医疗、法律、财务、危机和心理健康问题，需要合格的专业人士，而不是一次解读。','Medical, legal, financial, crisis, and mental-health concerns require qualified human support, not a reading.')}</p><div class="notice danger"><span>⚑</span><div>${L('如果你正处于立即危险中，请立刻联系当地紧急服务，或告诉一个现在能陪你的人。','If you are in immediate danger, contact local emergency services now or reach someone who can stay with you.')}</div></div></div></div></section><section class="section alt"><div class="panel"><h2>${L('Credits 与 Plus','Credits & Plus')}</h2><p>${L('Credits 可以用于选定的深度解读、圣所收藏和特别仪式。它们与本人账户绑定，不能转让、交易或兑换现金。Plus 每月提供 Credits 和更长的历史记录；购买的 Credits 不会因为取消 Plus 而消失。','Credits can be used for selected Deep Readings, Sanctuary collectibles, and special rituals. They are personal to your account and cannot be transferred, traded, or redeemed for cash. Plus includes monthly Credits and longer history; purchased Credits remain if you cancel Plus.')}</p><div class="button-row"><a class="primary-btn" href="#plans">${L('查看 Plus 与 Credits','See Plus & Credits')}</a><a class="ghost-btn" href="#privacy">${L('管理隐私与数据','Manage privacy & data')}</a></div></div></section></div></div>`}

function renderNotFound(){return `<div class="page"><div class="shell"><div class="empty"><h1>${L('这里没有这个页面','This page is not here')}</h1><p>${L('回到首页，重新选择想去的地方。','Return home and choose where you would like to go next.')}</p><a class="primary-btn" href="#home">${L('返回首页','Back home')}</a></div></div></div>`}
function renderApp(){document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';document.body.classList.toggle('reduce-motion',state.settings.reduceMotion);renderHeader();renderFooter();const routes={home:renderHome,readings:renderReadingsHub,daily:renderDaily,tarot:renderTarot,deep:renderDeep,numerology:renderNumerology,astrology:renderAstrology,sanctuary:renderSanctuary,journal:renderJournal,revisit:renderRevisit,plans:renderPlans,checkout:renderCheckout,'sign-in':renderSignIn,account:renderAccount,orders:renderOrders,billing:renderBilling,privacy:renderPrivacy,trust:renderTrust};const fn=routes[currentRoute()]||renderNotFound;document.getElementById('main').innerHTML=fn();if(state.ritual.running&&currentRoute()==='sanctuary')startRitualTimer()}
window.addEventListener('hashchange',()=>{clearInterval(ritualInterval);if(state.ritual.running){state.ritual.running=false;state.ritual.status='paused';saveState()}renderApp();scrollTopAndFocus()});
window.addEventListener('beforeunload',()=>{clearInterval(ritualInterval);saveState()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&document.getElementById('modalBackdrop')?.classList.contains('open'))closeModal();if(event.key==='Tab'&&document.getElementById('modalBackdrop')?.classList.contains('open')){const nodes=[...document.querySelectorAll('#modal button,#modal a,#modal input,#modal textarea,#modal select')].filter(x=>!x.disabled&&x.offsetParent!==null);if(nodes.length){const first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}}});
if(!location.hash)location.hash='#home';else renderApp();
</script>
